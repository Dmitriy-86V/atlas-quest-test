name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p reports
          echo "probe ok $(date -u)" > reports/probe.txt
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add reports/probe.txt; git commit -m "probe report [skip ci]"; git push
