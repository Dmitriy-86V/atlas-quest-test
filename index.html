    <div class="foot"><button class="linkbtn" id="reset">Начать игру заново</button><div style="opacity:.7;margin-top:6px;font-size:14px">Версия ${VER_LABEL}</div></div>`;
  app.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => startChapter(b.dataset.ch));
  document.getElementById('jr').onclick = () => { renderJournal(); goTop(); };
  document.getElementById('yard').onclick = () => { yardTab = 'hull'; renderShipyard(); goTop(); };
  document.getElementById('reset').onclick = restartGame;
  worldReady.then(drawHubMap);
}

function score(c){ const cs = state.ch[c.id]; if(!cs) return 0; return Object.values(cs.best || cs.answers || {}).filter(v => v === true).length; }

function drawHubMap(){
  const box = document.getElementById('hubmap'); if(!box) return;
  if(!world){ box.innerHTML = '<p class="muted center" style="padding:30px">Для карты нужен интернет. Задания без карты работают и так.</p>'; return; }
  const w = box.clientWidth, h = Math.round(w*0.56);
  const rev = new Set(state.revealed);
  const fresh = new Set(state.newRev || []);
  const found = world.filter(f => rev.has(+f.id));
  let proj;
  if(found.length){
    /* приближаем атлас к открытым землям, оставляя вокруг «туман» неизвестного мира */
    const b = d3.geoBounds({type:'FeatureCollection', features:found.concat([{type:'Feature',geometry:{type:'Point',coordinates:TORTUGA}}])});
    const pad = 14;
    const bb = [[Math.max(-180, b[0][0]-pad), Math.max(-70, b[0][1]-pad)], [Math.min(180, b[1][0]+pad), Math.min(80, b[1][1]+pad)]];
    proj = d3.geoMercator().fitExtent([[6,6],[w-6,h-6]], {type:'MultiPoint', coordinates:bb}).clipExtent([[0,0],[w,h]]);
  } else {
    proj = d3.geoNaturalEarth1().fitExtent([[4,4],[w-4,h-4]], {type:'Sphere'});
  }
  const path = d3.geoPath(proj);
  const svg = d3.select(box).html('').append('svg').attr('width',w).attr('height',h).style('cursor','default');
  svg.append('rect').attr('class','sea').attr('width',w).attr('height',h);
  svg.append('path').datum(d3.geoGraticule10()).attr('class','grat').attr('d',path);
  svg.selectAll('.land').data(world).join('path')
    .attr('class', d => 'land ' + (fresh.has(+d.id) ? 'newrev' : (rev.has(+d.id) ? 'revealed' : 'fog'))).attr('d',path);
  if(fresh.size){
    setTimeout(() => { svg.selectAll('.land.newrev').classed('go', true); sfx('coin'); }, 700);
    state.newRev = []; save();
  }
  CHAPTERS.forEach(c => {
    if(c.route && state.ch[c.id] && state.ch[c.id].done){
      svg.append('path').datum({type:'LineString', coordinates:c.route}).attr('class','route').attr('d',path);
    }
  });
  const [x,y] = proj(TORTUGA);
  svg.append('g').attr('transform', `translate(${x-22},${y-30})`).html(shipSVG(shipCfg(), 44, {flat:true}));
  /* туман над атласом: пока ничего не открыто — над всей картой, потом только по краям, вокруг открытых земель */
  box.style.position = 'relative';
  const fog = document.createElement('div');
  fog.className = 'atlasfog' + (found.length ? ' edge' : '');
  fog.style.opacity = found.length ? Math.max(.35, .8 - found.length * .01) : .9;
  fog.innerHTML = '<i></i><i></i>';
  box.appendChild(fog);
}

function startChapter(id){
  const cs = state.ch[id];
  if(cs && cs.done){ state.ch[id] = {idx:0, answers:{}, done:true, replay:true, best:cs.best || cs.answers}; }
  else if(cs && cs.idx === 0){ delete cs.freeHint; delete cs.glass; }
  else if(!cs){ state.ch[id] = {idx:0, answers:{}, done:false}; }
  save(); renderChapter(id); goTop();
}

function renderChapter(id){
  const c = CHAPTERS.find(x => x.id === id), cs = state.ch[id];
  const tasks = c.steps.filter(s => s.type !== 'story');
  if(cs.idx >= c.steps.length) return finishChapter(c);
  const step = c.steps[cs.idx];
  let sc = 'ocean-day'; for(let k=cs.idx;k>=0;k--){ if(c.steps[k].scene){ sc = c.steps[k].scene; break; } }
  showScene(sc);
  if(step.who) setSpeaker(step.who); else setCast('hero', null, 'L');
  const doneCount = c.steps.slice(0, cs.idx).filter(s => s.type !== 'story').length;
  const bar = `<div class="progress"><div style="width:${Math.round(doneCount/tasks.length*100)}%"></div></div>`;
  if(step.type === 'story'){
    let hc = '';
    if(step.hero){
      state.heroes = state.heroes || [];
      const isNew = !state.heroes.includes(step.hero);
      if(isNew){ state.heroes.push(step.hero); save(); }
      hc = heroCardHtml(step.hero, isNew);
    }
    app.innerHTML = `${topbar()}${bar}<div class="card story">${speakerHtml(step.who)}${paras(step.text)}${hc}
      <div class="row"><button class="btn" id="next">Дальше</button></div></div>`;
    fillAvatars();
    document.getElementById('next').onclick = () => { cs.idx++; save(); renderChapter(id); goTop(); };
    return;
  }
  cur = {hint:false, chapter:id};
  const num = tasks.indexOf(step) + 1;
  app.innerHTML = `${topbar()}${bar}<div class="card">
    ${speakerHtml(step.who)}
    <div class="tasknum">Задание ${num} из ${tasks.length}</div>
    <div class="q">${fill(step.q)}</div>
    <div id="hintbox"><button class="btn ghost small" id="hintBtn">Спросить штурмана</button>
      <span class="muted" style="font-size:14px">${owns('tools','astrolabe') && !cs.freeHint ? ' астролябия: одна подсказка в этом плавании бесплатно' : ' подсказка уменьшит награду до 5 золотых'}</span>
      ${owns('tools','spyglass') && !cs.glass && step.type === 'choice' && step.opts.length > 2 ? '<button class="btn ghost small" id="glassBtn">Подзорная труба</button>' : ''}</div>
    <div id="body" style="margin-top:12px"></div>
    <div id="feedback"></div></div>
    <div class="foot"><button class="linkbtn" id="tohub">Вернуться в порт (прогресс сохранится)</button></div>`;
  fillAvatars();
  document.getElementById('hintBtn').onclick = () => {
    const hb = c.hintBy || 'sebastian';
    if(owns('tools','astrolabe') && !cs.freeHint){ cs.freeHint = true; save(); } else cur.hint = true;
    setSpeaker(hb);
    document.getElementById('hintbox').innerHTML = `<div class="hint">${hb === 'sebastian' ? 'Себастьян' : CHARS[hb].name}: «${step.hint}»</div>`;
  };
  document.getElementById('tohub').onclick = () => { renderHub(); goTop(); };
  const body = document.getElementById('body');
  ({choice:renderChoice, map:renderMapTask, order:renderOrder, match:renderMatch})[step.type](step, body);
  /* подзорная труба: раз за плавание убирает один неверный вариант */
  const gb = document.getElementById('glassBtn');
  if(gb) gb.onclick = () => {
    const wrong = [...body.querySelectorAll('.opt')].filter(b => +b.dataset.i !== step.ans && !b.disabled);
    if(!wrong.length) return;
    const b = wrong[Math.floor(Math.random() * wrong.length)];
    b.disabled = true; b.classList.add('glassed'); b.textContent = '🔭 ' + b.textContent + ' — не то';
    cs.glass = true; save(); gb.remove();
  };
}

function answer(task, ok, rightText){
  const cs = state.ch[cur.chapter];
  /* проверочный вопрос: дальше можно пройти только с верным ответом */
  if(task.retry && ok === false){
    cs.missed = cs.missed || {}; cs.missed[task.id] = true; save();
    sfx('bad');
    document.getElementById('feedback').innerHTML = `<div class="fb bad"><h3>Не совсем…</h3>
      <p>${task.retry}</p><button class="btn" id="again">Ответить ещё раз</button></div>`;
    document.getElementById('again').onclick = () => { renderChapter(cur.chapter); goTop(); };
    document.getElementById('feedback').scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  const first = !(task.id in cs.answers);
  let reward = 0, newCard = false;
  if(first){
    cs.answers[task.id] = ok;
    if(ok === true && !cs.replay){ reward = (cur.hint || (cs.missed && cs.missed[task.id])) ? 5 : 10; state.gold += reward; }
    if(reward) setTimeout(() => sfx('coin'), 450);
    if(task.card && !state.journal.includes(task.id)){ state.journal.push(task.id); newCard = true; }
    if(ok === true && task.rv) revealIds(task.rv.ids);
    save();
  }
  const hb = document.getElementById('hintbox'); if(hb && !cur.hint) hb.innerHTML = '';
  sfx(ok === true ? 'ok' : (ok === false ? 'bad' : 'click'));
  const cls = ok === true ? 'ok' : (ok === false ? 'bad' : 'neutral');
  const title = ok === true ? 'Верно!' : (ok === false ? 'Не совсем…' : 'Вот что важно знать');
  document.getElementById('feedback').innerHTML = `<div class="fb ${cls}">
    <h3>${title}</h3>
    ${ok === false && rightText ? `<p><b>Правильный ответ:</b> ${rightText}</p>` : ''}
    ${ok === true && task.rv && task.rv.bbox ? '<div class="mapbox revealbox" id="rvmap"><span class="rv-cap">Атлас оживает</span></div>' : ''}
    ${task.exp.map(t => `<p>${t}</p>`).join('')}
    ${reward ? `<p class="reward">+${reward} золотых</p>` : ''}
    ${newCard ? `<p class="newcard">В журнал добавлена карточка «${task.card.title}»</p>` : ''}
    <button class="btn" id="cont">Дальше</button></div>`;
  document.getElementById('cont').onclick = () => { cs.idx++; save(); renderChapter(cur.chapter); goTop(); };
  document.getElementById('feedback').scrollIntoView({behavior:'smooth', block:'start'});
  if(ok === true && task.rv && task.rv.bbox) worldReady.then(() => drawReveal(task.rv));
}

/* ===================== ОТКРЫТИЕ НОВЫХ ЗЕМЕЛЬ ===================== */
function revealIds(ids){
  state.newRev = state.newRev || [];
  (ids || []).forEach(id => {
    if(!state.revealed.includes(id)){ state.revealed.push(id); state.newRev.push(id); }
  });
}
function drawReveal(rv){
  const box = document.getElementById('rvmap'); if(!box) return;
  if(!world){ box.remove(); return; }
  const w = box.clientWidth, h = Math.round(w * 0.5);
  /* показываем шире, чем само место: чтобы были видны очертания материков и океаны вокруг */
  const [[x0,y0],[x1,y1]] = rv.bbox, cx = (x0+x1)/2, cy = (y0+y1)/2;
  const sx = Math.max((x1-x0)*1.3, 50) / 2, sy = Math.max((y1-y0)*1.3, 30) / 2;
  const bb = [[Math.max(-180, cx-sx), Math.max(-72, cy-sy)], [Math.min(180, cx+sx), Math.min(78, cy+sy)]];
  const proj = d3.geoMercator().fitExtent([[12,12],[w-12,h-12]], {type:'MultiPoint', coordinates:bb}).clipExtent([[0,0],[w,h]]);
  const path = d3.geoPath(proj);
  const svg = d3.select(box).append('svg').attr('width', w).attr('height', h);
  svg.append('path').datum(d3.geoGraticule().step([5,5])()).attr('class','grat').attr('d', path);
  svg.selectAll('.rv-land').data(world).join('path').attr('class','rv-land').attr('d', path);
  const ids = (rv.hl || []).concat(rv.ids || []);
  const hits = svg.selectAll('.rv-hit').data(world.filter(f => ids.includes(+f.id))).join('path').attr('class','rv-hit').attr('d', path);
  hits.each(function(){
    const L = this.getTotalLength ? this.getTotalLength() : 0;
    d3.select(this).attr('stroke-dasharray', L).attr('stroke-dashoffset', L)
      .transition().duration(1600).ease(d3.easeCubicInOut).attr('stroke-dashoffset', 0)
      .on('end', function(){ d3.select(this).attr('stroke-dasharray', null).classed('filled', true); });
  });
  let delay = ids.length ? 1300 : 200;
  if(rv.circle){
    const c = d3.geoCircle().center([rv.circle[0], rv.circle[1]]).radius(rv.circle[2])();
    const cp = svg.append('path').datum(c).attr('class','rv-circle').attr('d', path).style('opacity', 0);
    setTimeout(() => { cp.transition().duration(900).style('opacity', 1).on('end', () => cp.classed('filled', true)); }, 200);
    delay = 1000;
  }
  if(rv.route){
    const rp = svg.append('path').datum({type:'LineString', coordinates:rv.route}).attr('class','rv-route').attr('d', path);
    const L = rp.node().getTotalLength();
    rp.attr('stroke-dasharray', `${L} ${L}`).attr('stroke-dashoffset', L)
      .transition().duration(2600).ease(d3.easeCubicInOut).attr('stroke-dashoffset', 0)
      .on('end', () => rp.attr('stroke-dasharray', '7 5'));
    delay = 2300;
  }
  if(rv.branch){
    const bp = svg.append('path').datum({type:'LineString', coordinates:rv.branch}).attr('class','rv-route').attr('d', path).style('opacity', 0).attr('stroke-dasharray', '3 5');
    const [bx, by] = proj(rv.branch[rv.branch.length-1]);
    setTimeout(() => {
      bp.transition().duration(900).style('opacity', .8);
      const t2 = svg.append('text').attr('class','rv-label').attr('x', bx).attr('y', by + 22).attr('text-anchor', bx > w * .7 ? 'end' : 'middle').text(rv.branchLabel || '');
      requestAnimationFrame(() => t2.classed('on', true));
    }, delay + 600);
  }
  if(rv.at){
    const [x, y] = proj(rv.at);
    setTimeout(() => {
      if(!rv.route && !rv.circle){
        svg.append('circle').attr('class','rv-pulse').attr('cx', x).attr('cy', y).attr('r', 6);
        svg.append('circle').attr('class','rv-dot').attr('cx', x).attr('cy', y).attr('r', 5);
      }
      const anchor = x > w * .7 ? 'end' : (x < w * .3 ? 'start' : 'middle');
      const t = svg.append('text').attr('class','rv-label').attr('x', x + (anchor === 'start' ? 10 : anchor === 'end' ? -10 : 0))
        .attr('y', y - 12).attr('text-anchor', anchor).text(rv.label);
      requestAnimationFrame(() => t.classed('on', true));
      sfx('coin');
    }, delay);
  }
}

/* ---------- Типы заданий ---------- */
function renderChoice(task, body){
  const order = task.noShuffle ? task.opts.map((_,i) => i) : shuffle(task.opts.map((_,i) => i));
  body.innerHTML = order.map(i => `<button class="opt" data-i="${i}">${esc(task.opts[i])}</button>`).join('');
  body.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ok = i === task.ans;
    body.querySelectorAll('.opt').forEach(x => { x.disabled = true; if(+x.dataset.i === task.ans && (ok || !task.retry)) x.classList.add('right'); });
    if(!ok) b.classList.add('wrong');
    answer(task, ok, esc(task.opts[task.ans]));
  });
}

function renderOrder(task, body){
  const items = shuffle(task.items.map((t,i) => ({t,i})));
  let seq = [], locked = false;
  function draw(result){
    body.innerHTML = `<div>${task.items.map((_,k) => {
        const it = seq[k];
        const cls = result ? (it && it.i === k ? ' ok' : ' no') : '';
        return `<div class="slot${cls}">${k+1}. ${it ? esc(it.t) : '<span class="muted">…</span>'}</div>`;
      }).join('')}</div>
      ${locked ? '' : `<p class="muted" style="font-size:15px;margin:10px 0 4px">Нажимай события по порядку:</p>
      <div class="chips">${items.filter(x => !seq.includes(x)).map(x => `<button class="chip" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost small" id="ores">Сбросить</button>
      <button class="btn small" id="ochk" ${seq.length < items.length ? 'disabled' : ''}>Проверить</button></div>`}`;
    if(locked) return;
    body.querySelectorAll('.chip').forEach(b => b.onclick = () => { seq.push(items.find(x => x.i === +b.dataset.i)); draw(); });
    document.getElementById('ores').onclick = () => { seq = []; draw(); };
    document.getElementById('ochk').onclick = () => {
      locked = true;
      const ok = seq.every((it,k) => it.i === k);
      draw(true);
      answer(task, ok, task.items.map(esc).join(' → '));
    };
  }
  draw();
}

function renderMatch(task, body){
  const P = task.pairs, right = shuffle(P.map((_,j) => j));
  let sel = 0, asg = {}, locked = false;
  function draw(result){
    body.innerHTML = P.map((p,i) => {
      const cls = result ? (asg[i] === i ? ' ok' : ' no') : (sel === i && !locked ? ' sel' : '');
      return `<button class="mrow${cls}" data-l="${i}"><b>${esc(p[0])}</b><span>${asg[i] != null ? esc(P[asg[i]][1]) : '— выбери вариант ниже —'}</span></button>`;
    }).join('') + (locked ? '' : `<div class="chips">${right.map(j => `<button class="chip${Object.values(asg).includes(j) ? ' used' : ''}" data-r="${j}">${esc(P[j][1])}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost small" id="mres">Сбросить</button>
      <button class="btn small" id="mchk" ${Object.keys(asg).length < P.length ? 'disabled' : ''}>Проверить</button></div>`);
    if(locked) return;
    /* повторное нажатие на выбранную строку снимает её вариант */
    body.querySelectorAll('.mrow').forEach(b => b.onclick = () => { const i = +b.dataset.l; if(sel === i && asg[i] != null) delete asg[i]; sel = i; draw(); });
    document.getElementById('mres').onclick = () => { asg = {}; sel = 0; draw(); };
    body.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      const j = +b.dataset.r;
      Object.keys(asg).forEach(k => { if(asg[k] === j) delete asg[k]; });
      asg[sel] = j;
      const nxt = P.findIndex((_,i) => asg[i] == null);
      if(nxt >= 0) sel = nxt;
      draw();
    });
    document.getElementById('mchk').onclick = () => {
      locked = true;
      const ok = P.every((_,i) => asg[i] === i);
      draw(true);
      answer(task, ok, P.map(p => `${esc(p[0])} — ${esc(p[1])}`).join('; '));
    };
  }
  draw();
}

function renderMapTask(task, body){
  body.innerHTML = '<p class="muted">Загружаем карту…</p>';
  worldReady.then(() => {
    if(!world){
      body.innerHTML = `<p class="muted">Карта не загрузилась — для неё нужен интернет.</p><button class="btn small" id="skip">Пропустить задание</button>`;
      document.getElementById('skip').onclick = () => { document.getElementById('skip').disabled = true; answer(task, null, ''); };
      return;
    }
    body.innerHTML = `<div class="mapbox" id="tmap"></div>
      <p class="muted" style="font-size:15px;margin:8px 0 0">Нажми на карту, чтобы поставить отметку, затем подтверди.</p>
      <div class="row"><button class="btn small" id="mok" disabled>Подтвердить</button></div>`;
    const box = document.getElementById('tmap');
    const w = box.clientWidth, h = Math.round(w*0.72);
    const proj = d3.geoMercator().fitExtent([[10,10],[w-10,h-10]], {type:'MultiPoint', coordinates:task.bbox}).clipExtent([[0,0],[w,h]]);
    const path = d3.geoPath(proj);
    const svg = d3.select(box).append('svg').attr('width',w).attr('height',h);
    svg.append('rect').attr('class','sea').attr('width',w).attr('height',h);
    svg.append('path').datum(d3.geoGraticule().step([5,5])()).attr('class','grat').attr('d',path);
    svg.selectAll('.land').data(world).join('path').attr('class','land plain').attr('d',path);
    (task.labels || []).forEach(([lon,lat,t]) => { const [x,y] = proj([lon,lat]); svg.append('text').attr('class','maplabel').attr('x',x).attr('y',y).attr('text-anchor','middle').text(t); });
    const mk = svg.append('g').style('display','none');
    mk.append('circle').attr('r',9).attr('fill','none').attr('stroke','#9c4a24').attr('stroke-width',2.5);
    mk.append('circle').attr('r',3).attr('fill','#9c4a24');
    let pick = null, done = false;
    svg.on('click', ev => {
      if(done) return;
      const [x,y] = d3.pointer(ev);
      pick = proj.invert([x,y]);
      mk.style('display',null).attr('transform', `translate(${x},${y})`);
      document.getElementById('mok').disabled = false;
    });
    document.getElementById('mok').onclick = () => {
      if(!pick || done) return;
      done = true; document.getElementById('mok').disabled = true;
      const km = d3.geoDistance(pick, task.target) * 6371;
      let ok = km <= task.tol;
      if(!ok && task.country){ const f = world.find(f => +f.id === task.country); if(f && d3.geoContains(f, pick)) ok = true; }
      const [tx,ty] = proj(task.target), [px,py] = proj(pick);
      if(!ok && task.retry){ answer(task, ok, ''); return; } /* проверочный вопрос: правильное место не показываем */
      if(!ok) svg.append('line').attr('x1',px).attr('y1',py).attr('x2',tx).attr('y2',ty).attr('stroke','#a23b2f').attr('stroke-width',1.5).attr('stroke-dasharray','4 3');
      svg.append('circle').attr('cx',tx).attr('cy',ty).attr('r',7).attr('fill', '#2f7a4a').attr('stroke','#fff').attr('stroke-width',2);
      svg.append('text').attr('x',tx+10).attr('y',ty-8).attr('font-weight','700').attr('font-size',14).attr('fill','#1d4d2f').text(task.targetLabel);
      let dir = '';
      if(!ok && owns('tools','crossstaff')){
        const dLat = task.target[1] - pick[1], dLon = task.target[0] - pick[0];
        const ns = Math.abs(dLat) > Math.abs(dLon) * 0.4 ? (dLat > 0 ? 'север' : 'юг') : '';
        const ew = Math.abs(dLon) > Math.abs(dLat) * 0.4 ? (dLon > 0 ? 'восток' : 'запад') : '';
        const w = ns && ew ? (ns === 'север' ? 'северо-' : 'юго-') + ew : (ns || ew);
        dir = `<br>📏 Градшток: правильное место лежит на ${w} от твоей отметки.`;
      }
      answer(task, ok, `зелёная точка на карте — ${esc(task.targetLabel)}${ok ? '' : ` (твоя отметка в ${Math.round(km)} км от неё)`}${dir}`);
    };
  });
}

function finishChapter(c){
  showScene('sunset-port');
  setCast('hero', 'sebastian', 'L');
  setTimeout(() => sfx('fanfare'), 300);
  const cs = state.ch[c.id];
  const tasks = c.steps.filter(s => s.type !== 'story');
  const right = Object.values(cs.answers).filter(v => v === true).length;
  let bonus = 0;
  let gifts = '';
  if(!cs.done){
    cs.done = true; bonus = 20; state.gold += bonus;
    revealIds(c.reveal);
    ensureYard();
    const Y = state.yard;
    if(c.id === 'c1' && !Y.own.hull.includes('sloop')){
      Y.own.hull.push('sloop'); if(Y.eq.hull === 'keel') Y.eq.hull = 'sloop';
      gifts += `<p class="newcard">🎁 Себастьян: «За такое плавание верфь бесплатно поставит тебе корпус шлюпа». Теперь у тебя есть настоящий корабль — загляни на верфь!</p>`;
    }
    const T = TROPHIES[c.id];
    if(T && !Y.trophies.includes(T.id)){ Y.trophies.push(T.id); Y.deck.push(T.id); gifts += `<p class="newcard">🏆 Трофей плавания: ${T.n}. Он уже стоит на палубе твоего корабля.</p>`; }
  }
  if(cs.replay){
    const prevBest = cs.best ? Object.values(cs.best).filter(v => v === true).length : 0;
    if(right > prevBest) cs.best = Object.assign({}, cs.answers);
  } else { cs.best = Object.assign({}, cs.answers); }
  save();
  app.innerHTML = `${topbar()}<div class="card story">
    <h2>Глава пройдена!</h2>
    ${speakerHtml('hero')}
    ${paras(c.outro)}
    <p><b>Верных ответов: ${right} из ${tasks.length}</b>${bonus ? ` · <span style="color:var(--gold);font-weight:700">+${bonus} золотых за плавание</span>` : ''}</p>${gifts}
    <div class="row"><button class="btn" id="hub">Открыть атлас</button></div></div>`;
  fillAvatars();
  document.getElementById('hub').onclick = () => { renderHub(); goTop(); };
}

function renderJournal(){
  const all = allTasks().filter(t => t.card);
  showScene('map');
  setSpeaker(null);
  app.innerHTML = `${topbar()}<div class="card">
    <h2>Судовой журнал</h2>
    ${(state.heroes || []).length ? `<h3 style="margin:10px 0 4px">Мореплаватели</h3>${state.heroes.map(id => heroCardHtml(id, false)).join('')}<h3 style="margin:14px 0 4px">Открытия</h3>` : ''}
    <p class="muted">Собрано карточек: ${state.journal.length} из ${all.length}</p>
    <div class="jgrid">${all.map(t => state.journal.includes(t.id)
      ? `<div class="jcard"><h3>${t.card.title}</h3><p>${t.card.text}</p></div>`
      : `<div class="jcard locked">Ещё не открыто</div>`).join('')}</div>
    <div class="row"><button class="btn" id="back">Назад в порт</button></div></div>`;
  fillAvatars();
  document.getElementById('back').onclick = () => { renderHub(); goTop(); };
}

start();
</script>
</body>
</html>
