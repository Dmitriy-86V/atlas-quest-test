<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Атлас пропавшего картографа</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14303f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Атлас">
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
:root{
  --bg:#14303f;--bg2:#1f4a5e;--parch:#f4e8cc;--paper:#fffaf0;--ink:#3a2a1a;--ink2:#6b5640;
  --line:#c9b285;--accent:#9c4a24;--gold:#c08a1e;--ok:#2f7a4a;--okbg:#e3efdc;--bad:#a23b2f;--badbg:#f6e0da;
  --sea:#a9c9cc;--land:#efe2c2;--fog:#d9d0bd;--rev:#c99e4e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%);background-attachment:fixed;min-height:100vh;
  color:var(--ink);font-family:'PT Serif',Georgia,serif;font-size:17px;line-height:1.55}
#app{max-width:720px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:'Philosopher',Georgia,serif;margin:0 0 .5em;line-height:1.2}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px}
p{margin:0 0 .8em}
.card{background:var(--parch);border:1px solid var(--line);border-radius:14px;padding:20px;
  box-shadow:0 10px 28px rgba(0,0,0,.28);margin-bottom:16px}
.muted{color:var(--ink2)}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{font-family:'Philosopher',Georgia,serif;font-weight:700;font-size:17px;background:var(--accent);color:#fff8ec;
  border:0;border-radius:10px;padding:12px 20px;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{font-size:15px;min-height:40px;padding:8px 14px}
.btn.wide{width:100%}
.topbar{display:flex;align-items:center;gap:10px;color:var(--parch);margin-bottom:14px;flex-wrap:wrap}
.topbar .who{flex:1;min-width:0}
.topbar .ship{font-family:'Philosopher',serif;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .cap{font-size:14px;opacity:.8}
.restart{font:inherit;font-size:14px;background:transparent;color:var(--parch);border:1px solid rgba(244,232,204,.5);border-radius:20px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.restart:hover{background:rgba(244,232,204,.15)}
.gold{background:rgba(192,138,30,.2);border:1px solid var(--gold);color:#f1d48a;border-radius:20px;padding:4px 12px;font-weight:700;white-space:nowrap}
.story p{font-size:18px}
.story .speaker{font-style:italic;color:var(--ink2)}
label{display:block;font-weight:700;margin:14px 0 6px}
input[type=text]{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font:inherit;font-size:15px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:20px;padding:8px 14px;cursor:pointer}
.chip.used{opacity:.4}
.swatches{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.sw.sel{border-color:var(--ink)}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;
  padding:12px 14px;margin:8px 0;cursor:pointer;color:var(--ink);min-height:48px}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.progress{height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin-bottom:14px}
.progress div{height:100%;background:var(--gold)}
.tasknum{font-size:14px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.q{font-size:19px;margin:6px 0 10px}
.hint{background:#efe0bb;border-left:4px solid var(--gold);padding:10px 12px;border-radius:6px;font-style:italic;margin:10px 0}
.fb{border-radius:12px;padding:16px;margin-top:14px;border:1.5px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb.neutral{background:#efe6d2;border-color:var(--line)}
.fb .reward{font-weight:700;color:var(--gold)}
.fb .newcard{font-size:15px;color:var(--ink2)}
.slot{background:var(--paper);border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}
.slot.ok{border:1.5px solid var(--ok);background:var(--okbg)}
.slot.no{border:1.5px solid var(--bad);background:var(--badbg)}
.mrow{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;font:inherit;background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer;color:var(--ink)}
.mrow span{font-size:15px;color:var(--ink2)}
.mrow.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(156,74,36,.25)}
.mrow.ok{border-color:var(--ok);background:var(--okbg)}
.mrow.no{border-color:var(--bad);background:var(--badbg)}
.mapbox{width:100%;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);background:var(--sea);touch-action:manipulation}
.mapbox svg{display:block;cursor:crosshair}
.sea{fill:var(--sea)}
.grat{fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:.5}
.land{stroke:#a89874;stroke-width:.4}
.land.plain{fill:var(--land)}
.land.fog{fill:var(--fog)}
.land.revealed{fill:var(--rev)}
.route{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-dasharray:6 4}
.maplabel{font-family:'PT Serif',serif;font-style:italic;font-size:12px;fill:#2c4a55}
.chapter{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);margin:8px 0}
.chapter.locked{opacity:.55}
.chapter .num{font-family:'Philosopher',serif;font-weight:700;font-size:22px;width:36px;height:36px;border-radius:50%;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.chapter.locked .num{background:#9b8d73}
.chapter .info{flex:1;min-width:0}
.chapter .t{font-weight:700}
.chapter .s{font-size:14px;color:var(--ink2)}
.badge{font-size:13px;color:var(--ok);font-weight:700}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.jcard{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px}
.jcard h3{font-size:17px;margin-bottom:4px}
.jcard p{font-size:15px;margin:0}
.atlasfog{position:absolute;inset:0;pointer-events:none;border-radius:inherit;overflow:hidden}
.atlasfog i{position:absolute;inset:0;background-size:170% 170%;background-image:
  radial-gradient(closest-side at 30% 40%,rgba(255,250,238,.85),transparent),
  radial-gradient(closest-side at 70% 60%,rgba(255,250,238,.75),transparent),
  radial-gradient(closest-side at 50% 25%,rgba(240,232,212,.7),transparent),
  radial-gradient(closest-side at 20% 75%,rgba(240,232,212,.7),transparent);
  background-repeat:no-repeat;animation:fogdrift 26s ease-in-out infinite alternate}
.atlasfog i+i{animation-duration:34s;animation-direction:alternate-reverse;opacity:.8}
.atlasfog.edge{-webkit-mask:radial-gradient(ellipse at center,transparent 38%,#000 78%);mask:radial-gradient(ellipse at center,transparent 38%,#000 78%)}
@keyframes fogdrift{from{background-position:20% 30%}to{background-position:80% 70%}}
@media (prefers-reduced-motion:reduce){.atlasfog i{animation:none}}
#whatsnew{position:fixed;inset:0;z-index:60;background:rgba(10,20,28,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#whatsnew .wn-card{max-width:520px;width:100%;max-height:90vh;overflow:auto;margin:0}
/* верфь */
.tship svg{display:block}
.hubship{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hubship .hs-pic{flex:none;background:linear-gradient(#cfe3ef,#eaf2f6);border-radius:10px;padding:4px 6px}
.hubship .hs-info{flex:1;min-width:200px}
.yship{display:flex;justify-content:center;background:linear-gradient(#cfe3ef,#eaf2f6);border-radius:12px;padding:6px}
.yship svg{max-width:100%;height:auto}
.shview{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.shphoto{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px}
.shplan{display:flex;flex-direction:column;align-items:center;background:#f6f1e4;border:1px dashed #b9a37a;border-radius:8px;padding:4px 8px;max-width:100%}
.shplan span{font-size:12px;color:var(--ink2);letter-spacing:.3px}
.ytabs .chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.ylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.ycard{display:flex;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px;align-items:flex-start}
.ycard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.ycard .yprev{flex:none;width:120px;display:flex;justify-content:center;align-items:center;min-height:90px;background:#eef3f5;border-radius:8px}
.ycard .yprev .yphoto{display:block;width:120px;height:90px;object-fit:cover;border-radius:8px}
.ycard .yinfo{flex:1;min-width:0}
.ycard .yinfo p{font-size:14px;margin:4px 0 8px;color:var(--ink2)}
.yown{font-size:14px;color:var(--ok);font-weight:700}
.yname label{display:block;margin-top:10px}
.opt.glassed{opacity:.45;text-decoration:line-through}
.herocard{display:flex;gap:14px;align-items:center;background:var(--paper);border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;margin:12px 0}
.herocard img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--gold)}
.herocard .hc-ico{width:72px;height:72px;border-radius:50%;flex:none;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:34px;background:#efe2c4}
.herocard .hc-t{font-family:'Philosopher',serif;font-weight:700;font-size:18px}
.herocard .hc-m{font-size:14px;color:var(--ink2);margin:2px 0 4px}
.herocard .hc-d{font-size:15px;margin:0}
.herocard .hc-new{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);font-weight:700}
.jcard.locked{display:flex;align-items:center;justify-content:center;color:var(--ink2);font-style:italic;min-height:90px;border-style:dashed}
.foot{text-align:center;margin-top:20px}
.linkbtn{background:none;border:0;color:var(--parch);opacity:.6;font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
@media (max-width:480px){h1{font-size:26px}.card{padding:16px}.q{font-size:18px}}

/* ===== Персонажи ===== */
.portrait{position:fixed;bottom:0;height:84vh;width:calc((100vw - 760px)/2 - 6px);max-width:44vw;object-fit:contain;
  z-index:1;pointer-events:none;opacity:0;transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1), filter .5s ease;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}
#pL{left:0;object-position:bottom center;transform:translateX(-60px)}
#pR{right:0;object-position:bottom center;transform:translateX(60px)}
#pL.on,#pR.on{opacity:1;transform:none}
.portrait.flip{scale:-1 1}
.portrait.dim{filter:drop-shadow(0 12px 22px rgba(0,0,0,.6)) brightness(.55) saturate(.7)}
.portrait.on:not(.dim){animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{translate:0 0}50%{translate:0 -6px}}
@media (max-width:900px){
  .portrait{height:var(--ph,40vh);width:52vw;max-width:none;filter:none!important;animation:none!important}
  .portrait.dim{opacity:0!important}
  #pR{width:56vw}
  body.noport .portrait{opacity:0!important}
  .title-card{background:var(--parch);margin-top:6vh}
  .topbar,.linkbtn,#sndBtn,#fsBtn{backdrop-filter:none!important}
  #app{padding-top:calc(54px + env(safe-area-inset-top))}
  #sndBtn,#fsBtn{position:absolute!important;width:38px!important;height:38px!important;font-size:17px!important;bottom:auto!important;top:max(8px, env(safe-area-inset-top))!important}
  #sndBtn{right:8px!important} #fsBtn{right:52px!important}
  .topbar{flex-wrap:nowrap;padding:6px 10px;gap:8px}
  .topbar svg{width:34px;height:34px}
  .topbar .ship{font-size:17px}
  .topbar .cap{font-size:12px}
  .topbar .rtxt{display:none}
  .gold{padding:3px 9px;font-size:14px}
  .title-card{margin-right:0}
  .simg{animation:none!important}
}
body.standalone #fsBtn{display:none!important}
@media (max-width:900px){
  #eyeBtn{position:absolute!important;width:38px!important;height:38px!important;font-size:16px!important;top:max(8px, env(safe-area-inset-top))!important;right:96px!important}
  body.standalone #eyeBtn{right:52px!important}
  .card{padding:14px 15px}
  body{font-size:16px}
  .story p{font-size:16px}
  .q{font-size:17px}
  .opt{padding:10px 12px;min-height:44px;margin:6px 0}
  .fb{padding:12px}
  .title-card h1{font-size:32px}
  #cineCap .place{font-size:18px;padding:8px 16px}
}
/* ===== Подсказка повернуть телефон ===== */
#rotate{display:none;position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at top,#1f3b55,#08121f 75%);color:#f4e8cc;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#rotate .rot-ico{font-size:64px;animation:rotIco 2.4s ease-in-out infinite}
@keyframes rotIco{0%,25%{transform:rotate(0)}50%,75%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rotate .rot-t{font-family:'Philosopher',serif;font-size:24px;font-weight:700;margin-top:18px}
#rotate .rot-s{opacity:.75;margin-top:6px;font-size:15px}
#rotate button{margin-top:28px;background:none;border:0;color:#f4e8cc;opacity:.6;text-decoration:underline;font:inherit;font-size:14px}
@media (orientation:portrait){ body.phone:not(.rotok) #rotate{display:flex} }
/* ===== Горизонтальный телефон: видео слева, текст панелью справа ===== */
@media (orientation:landscape) and (max-height:520px){
  #scenebg,#fx{right:44vw;transition:right .6s ease}
  body.cine #scenebg, body.peek #scenebg, body.cine #fx, body.peek #fx{right:0}
  .simg{inset:0!important;animation:none!important;background-position:var(--fx,50%) center!important}
  .svid{object-position:var(--fx,50%) center}
  .svig{background:linear-gradient(90deg,rgba(0,0,0,0) 70%,rgba(0,0,0,.55))}
  .portrait{height:82vh!important;width:24vw!important;max-width:none!important;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))!important}
  #pL{left:0!important;object-position:bottom center!important}
  #pR{right:44vw!important;left:auto!important;object-position:bottom center!important}
  body.noport .portrait.on{opacity:1!important}
  .portrait.dim{opacity:1!important;filter:brightness(.55) saturate(.7)!important}
  #app{width:44vw!important;max-width:none!important;margin:0!important;padding:8px 10px 24px 6px!important;
    position:fixed!important;top:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  body{font-size:15px}
  .card{padding:12px 14px!important;margin-bottom:10px;border-radius:12px}
  h2{font-size:20px} h3{font-size:17px}
  .story p{font-size:15px!important}
  .q{font-size:16px!important}
  .opt{padding:8px 11px!important;min-height:40px!important;margin:5px 0!important}
  .btn{min-height:42px;padding:9px 16px;font-size:16px}
  .speakerbar{margin-bottom:8px} .ava{width:46px!important;height:46px!important}
  .topbar{padding:5px 9px!important;gap:7px!important;flex-wrap:nowrap!important}
  .topbar svg{width:30px;height:30px} .topbar .ship{font-size:15px!important} .topbar .cap{font-size:11px!important}
  .topbar .rtxt{display:none} .gold{font-size:13px;padding:2px 8px}
  .title-card{margin-top:4vh!important;padding:18px 16px!important}
  .title-card h1{font-size:24px!important} .title-card .btn{min-width:0;width:100%}
  #sndBtn,#fsBtn,#eyeBtn{position:fixed!important;top:8px!important;right:auto!important;bottom:auto!important;width:38px!important;height:38px!important;font-size:16px!important}
  #eyeBtn{left:8px!important} #fsBtn{left:52px!important} #sndBtn{left:96px!important}
  body.standalone #sndBtn{left:52px!important}
  #cineCap .place{font-size:18px;padding:8px 18px}
  #cineCap{bottom:16px}
  .mapbox svg{max-width:100%}
}
/* на вертикальном экране держим в кадре главное в каждой сцене */
@media (orientation:portrait) and (max-width:900px){
  .simg{background-position:var(--fx,50%) center!important}
  .svid{object-position:var(--fx,50%) center}
}

.speakerbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ava{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#e6d3a8;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.speakerbar b{font-family:'Philosopher',serif;font-size:18px;color:var(--accent)}
/* ===== Атлас-пергамент ===== */
.mapbox{background:#e8d6ad;border:2px solid #8a6a3e;box-shadow:inset 0 0 40px rgba(110,70,30,.45)}
.sea{fill:#e8d6ad}
.grat{stroke:#8a6a3e;stroke-opacity:.25}
.land{stroke:#6b4a2a;stroke-width:.6}
.land.plain{fill:#cfae78}
.land.fog{fill:#d9c49a;stroke-opacity:.35}
.land.revealed{fill:#b5793d}
.route{stroke:#9c2a1e;stroke-width:2.4}
.maplabel{fill:#5a3c1e;font-size:13px}
/* ===== Картинки сцен ===== */
#scenebg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s}
body.has-img #scenebg{opacity:1}
#bg{display:none!important}
body{background:radial-gradient(ellipse at top,#1f3b55,#08121f 75%) fixed}
#bg{transition:opacity 1.2s}
/* переходы */
/* показ сцены перед текстом и режим «посмотреть сцену» */
#app,.portrait{transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
body.cine #app, body.peek #app{opacity:0!important;transform:translateY(40px);pointer-events:none}
body.cine .portrait, body.peek .portrait{opacity:0!important}
#cineCap{position:fixed;left:0;right:0;bottom:max(7vh, calc(24px + env(safe-area-inset-bottom)));z-index:4;text-align:center;pointer-events:none;
  opacity:0;transform:translateY(16px);transition:opacity .7s ease, transform .7s ease}
body.cine #cineCap{opacity:1;transform:none}
#cineCap .place{display:inline-block;font-family:'Philosopher',serif;font-weight:700;font-size:22px;color:#f7ecd2;
  background:rgba(8,18,31,.6);padding:10px 22px;border-radius:30px;border:1px solid rgba(232,198,106,.6);text-shadow:0 2px 6px rgba(0,0,0,.6)}
#cineCap .skip{display:block;margin-top:10px;font-size:13px;color:#f4e8cc;opacity:.75;text-shadow:0 1px 4px #000}
#cineCap .bar{width:120px;height:3px;margin:10px auto 0;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
#cineCap .bar i{display:block;height:100%;width:0;background:#e8c66a}
body.cine #cineCap .bar i{animation:cineBar var(--cine,3.5s) linear forwards}
@keyframes cineBar{to{width:100%}}
#cineTap{position:fixed;inset:0;z-index:3;display:none}
body.cine #cineTap, body.peek #cineTap{display:block}
#eyeBtn{position:fixed;top:12px;right:116px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid rgba(244,232,204,.5);
  background:rgba(10,25,40,.7);color:#f4e8cc;font-size:19px;cursor:pointer}
body.peek #eyeBtn{background:#9c4a24;border-color:#e8c66a}
body.standalone #eyeBtn{right:64px}
#app.enter > *{animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both}
#app.enter > *:nth-child(2){animation-delay:.07s}
#app.enter > *:nth-child(3){animation-delay:.14s}
#app.enter > *:nth-child(4){animation-delay:.21s}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
#curtain{position:fixed;inset:0;background:#05070c;opacity:0;pointer-events:none;z-index:0;transition:opacity .45s ease}
#curtain.dark{opacity:.6;transition:opacity .3s ease}
.simg.pre{filter:blur(12px) brightness(.55)}
/* движение камеры по сценам */
.simg.cam-arrive{animation:arrive 11s cubic-bezier(.25,.6,.3,1) forwards, bobS 7s ease-in-out 11s infinite}
@keyframes arrive{from{transform:scale(1) translate(4%,1.5%)}to{transform:scale(1.14) translate(-2%,-1%)}}
@keyframes bobS{0%,100%{transform:scale(1.14) translate(-2%,-1%)}50%{transform:scale(1.15) translate(-2.3%,-.6%)}}
.simg.cam-sea{animation:seaBob 7s ease-in-out infinite}
@keyframes seaBob{0%,100%{transform:scale(1.08) translateY(0) rotate(-.5deg)}50%{transform:scale(1.08) translateY(1.4%) rotate(.6deg)}}
.simg.cam-kb{animation:kb 40s ease-in-out infinite alternate}
/* эффекты поверх картинок */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fx .flicker{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,170,60,.18),rgba(0,0,0,0) 65%);animation:flick 2.3s infinite}
@keyframes flick{0%,100%{opacity:.7}12%{opacity:1}20%{opacity:.6}45%{opacity:.95}60%{opacity:.75}80%{opacity:1}}
#fx .spark{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#ffd98a;box-shadow:0 0 10px 3px rgba(255,200,90,.8);animation:rise linear infinite}
@keyframes rise{from{transform:translate(0,0);opacity:0}10%{opacity:1}to{transform:translate(var(--dx),-105vh);opacity:0}}
#fx .gull{position:absolute;width:34px;height:12px;animation:glide linear infinite}
#fx .gull svg{display:block;animation:flapG .5s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes glide{from{transform:translateX(-60px)}to{transform:translateX(calc(100vw + 60px))}}
@keyframes flapG{from{transform:scaleY(1)}to{transform:scaleY(-.4)}}
#fx .glint{position:absolute;left:0;right:0;bottom:0;height:35%;background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 40px,rgba(255,255,255,.07) 40px 46px,rgba(255,255,255,0) 46px 90px);background-size:300px 100%;animation:glint 6s linear infinite;mix-blend-mode:screen}
@keyframes glint{to{background-position:300px 0}}
.svid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
.svid.hold{animation:holdBreathe 18s ease-in-out infinite alternate}
@keyframes holdBreathe{from{transform:scale(1) translate(0,0)}to{transform:scale(1.045) translate(-.8%,-.6%)}}
@media (prefers-reduced-motion:reduce){.svid.hold{animation:none}}
.mi-hint{margin:12px 0 4px;padding:10px;border-radius:10px;background:#fff3d6;border:1px solid var(--gold);font-size:14px;color:var(--ink2)}
.mi-hint .btn{display:inline-block;margin-top:8px;text-decoration:none;min-width:0}
/* мини-карта открытия */
.revealbox{margin:12px 0 14px;position:relative}
.revealbox .rv-cap{position:absolute;left:10px;top:8px;font-family:'Philosopher',serif;font-weight:700;color:#6b3a1a;font-size:14px;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.rv-land{fill:#d8c194;stroke:#7a5530;stroke-width:.5}
.rv-hit{fill:#b5793d;fill-opacity:0;stroke:#7a2a12;stroke-width:1.8;transition:fill-opacity 1s ease .2s}
.rv-hit.filled{fill-opacity:1}
.rv-route{fill:none;stroke:#9c2a1e;stroke-width:2.6;stroke-linecap:round}
.rv-circle{fill:#6fa0a8;fill-opacity:0;stroke:#2f5d66;stroke-width:1.6;stroke-dasharray:5 4;transition:fill-opacity 1s ease}
.rv-circle.filled{fill-opacity:.35}
.rv-label{font-family:'Philosopher',serif;font-weight:700;font-size:16px;fill:#4a2410;paint-order:stroke;stroke:#f3e6c6;stroke-width:4px;opacity:0;transition:opacity .6s ease}
.rv-label.on{opacity:1}
.rv-dot{fill:#c0392b;stroke:#fff;stroke-width:2}
.rv-pulse{fill:none;stroke:#c0392b;stroke-width:2;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{r:6;opacity:1}to{r:26;opacity:0}}
.land.newrev{fill:#d9c49a;transition:fill 1.6s ease}
.land.newrev.go{fill:#b5793d}
/* титульный экран */
.title-card{text-align:center;padding:34px 24px 26px;margin-top:14vh;background:rgba(244,232,204,.94)}
.title-card h1{font-size:40px;margin-bottom:6px}
.title-card .sub{font-style:italic;color:var(--ink2);margin-bottom:22px}
.title-card .btn{min-width:260px;font-size:20px;margin:6px auto;display:block}
.title-card .small-note{font-size:13px;color:var(--ink2);margin-top:14px}
#fsBtn{position:fixed;top:12px;right:64px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid rgba(244,232,204,.5);
  background:rgba(10,25,40,.7);color:#f4e8cc;font-size:20px;cursor:pointer;backdrop-filter:blur(4px)}

/* звук */
#sndBtn{position:fixed;top:12px;right:12px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid rgba(244,232,204,.5);
  background:rgba(10,25,40,.7);color:#f4e8cc;font-size:20px;cursor:pointer;backdrop-filter:blur(4px)}

.simg{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;filter:blur(0) brightness(1);transition:opacity 1.4s ease, filter 1.8s ease;animation:kb 40s ease-in-out infinite alternate}
.simg.on{opacity:1}
.svig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.45) 100%)}
/* без наезда камеры: вся композиция в кадре */
.simg.cam-still{inset:0;animation:none}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(-1.5%,-1%)}}

#app{position:relative;z-index:1}

.w1{fill:#2a7aa3;animation-duration:14s}.w2{fill:#236a90;animation-duration:10s}.w3{fill:#1c5878;animation-duration:7s}

body.sky-dawn .w1{fill:#4a6d8c}body.sky-dawn .w2{fill:#3c5d7b}body.sky-dawn .w3{fill:#2f4d68}
body.sky-fog .w1{fill:#6c8590}body.sky-fog .w2{fill:#5d7580}body.sky-fog .w3{fill:#4e6570}
body.sky-sunset .w1{fill:#5a4d72}body.sky-sunset .w2{fill:#4a4063}body.sky-sunset .w3{fill:#3a3352}
.land-sil{transition:fill 1.4s ease;fill:#3d5a3a}
body.sky-night .land-sil{fill:#0e1d2a} body.sky-dawn .land-sil{fill:#2e3a4a} body.sky-sunset .land-sil{fill:#2b2238} body.sky-fog .land-sil{fill:#566a72}
.win{fill:#c9b98c;transition:fill 1.4s}
body.sky-night .win, body.sky-sunset .win{fill:#ffcf5c}
.beam{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}
.sun{transition:transform 2.2s ease, opacity 1.4s ease;opacity:0}
body.sky-dawn .sun, body.sky-day .sun, body.sky-sunset .sun{opacity:1}
.shipmove{transition:transform 2.6s cubic-bezier(.45,.05,.3,1)}
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(7px)}}
.cloud{fill:#fff;animation:drift linear infinite}
body.sky-sunset .cloud{fill:#f6c7a8} body.sky-dawn .cloud{fill:#f3d2c1}
@keyframes drift{from{transform:translateX(-400px)}to{transform:translateX(2000px)}}
.fogblob{fill:#e9eef0;animation:fogmove 18s ease-in-out infinite alternate}
@keyframes fogmove{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
.gullfly{animation:fly 28s linear infinite}
@keyframes fly{from{transform:translateX(-300px)}to{transform:translateX(1900px)}}
.wing{fill:none;stroke:#1d2b36;stroke-width:3;stroke-linecap:round;animation:flap .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.5)}}
.rose{animation:spin 90s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#bg *{animation:none!important}}

  ['Порт Тортуга, 1650 год. Ночь. Над гаванью горят звёзды, в бухте покачиваются корабли, а из таверны «Старый якорь» доносятся песни моряков. Ты — юнга, и здесь тебя знает каждый моряк.'],

const CHAPTERS = [
 {id:'c1', title:'Тортуга и Карибы', sub:'Христофор Колумб, 1492', ready:true,
  reveal:[724,192,332,214,44,388,630],

  steps:[
   {type:'story', scene:'tavern', who:'sebastian', text:['Себастьян не спешит отдавать компас.','<span class="speaker">«Прежде чем доверить тебе такую вещь, проверю, знаешь ли ты свой родной порт», — говорит он и хитро щурится.</span>']},
   {id:'t1', type:'choice', who:'sebastian', retry:'«Э, нет, юнга! — смеётся Себастьян. — Такой ответ компас не примет. Подумай ещё». Нажми «Спросить штурмана», если нужна подсказка.',

    q:'«Ну-ка, юнга, что значит по-испански слово „тортуга“?»',

         'Тортуга лежит у северного берега большого острова Эспаньола. В XVII веке здесь была одна из самых известных баз пиратов и буканьеров Карибского моря.',

    card:{title:'Остров Тортуга', text:'«Черепаха» по-испански. Пиратская гавань XVII века у северного берега Эспаньолы, сейчас — часть Гаити.'}},
   {id:'t2', type:'map', who:'sebastian', rv:{ids:[214]}, retry:'«Мимо! — качает головой Себастьян. — Капитан должен знать, где его родной порт. Попробуй ещё раз».',
    q:'«А теперь покажи на карте, где мы с тобой находимся».',

    exp:['Тортугу отделяет от Эспаньолы узкий пролив. Рядом проходит Наветренный пролив между Кубой и Эспаньолой — короткий путь из Атлантического океана в Карибское море.',

   {type:'story', who:'sebastian', text:['Себастьян довольно хмыкает и стучит трубкой по столу.',
     '<span class="speaker">«Вот теперь вижу: ты знаешь, где стоит твой корабль. Значит, не заблудишься и в чужих морях. Компас — твой»</span>.']},
   {type:'story', scene:'chest-open', who:'sebastian', text:['Себастьян ставит на стол потёртый сундук картографа и поворачивает в замке старый ключ.',
     '<span class="speaker">«Помоги-ка, юнга, крышка тяжёлая»</span>. Вы вместе поднимаете крышку — и изнутри льётся тёплый золотой свет.']},
   {type:'story', scene:'chest', who:'sebastian', text:['В сундуке лежат огромный атлас и медный компас. Себастьян бережно кладёт компас тебе на ладонь. Стрелка не замирает на севере — она медленно поворачивается, будто ищет дорогу.',
     '<span class="speaker">«Альварес говорил: компас сам знает, куда вести. Держи его крепко — и не бойся тумана»</span>.']},
   {type:'story', scene:'fog', text:['Ты крепко сжимаешь компас. Стрелка вращается всё быстрее, вокруг тебя закручивается золотой вихрь, и таверна тонет в густом тумане…']},
   {type:'story', scene:'palos', who:'sailor', text:['Туман рассеивается. Перед тобой чужой берег: белые дома, колокольня и три корабля у причала. На пристани говорят по-испански. Компас показывает дату: 2 августа 1492 года. Ты в испанском порту Палос.',
     'Мальчишка-матрос машет тебе рукой:',
     '<span class="speaker">«Ты новенькая? Давай к нам на „Пинту“, нам как раз нужен юнга! Адмирал Колумб отплывает на рассвете. Король Фердинанд и королева Изабелла дали ему три корабля: „Санта-Марию“, „Пинту“ и „Нинью“»</span>.',
     '<span class="speaker">«Адмирал хочет доплыть до Индии и Китая — там пряности, шёлк и золото. Только плыть он собирается не вокруг Африки, как португальцы, а прямо на запад, через океан. Говорят, так ближе!»</span>']},
   {type:'story', who:'columbus', hero:'columbus', text:['Вечером на пристань приходит сам адмирал — высокий седой человек в тёмно-красном плаще. Он внимательно смотрит на тебя и на твой компас.',
     '<span class="speaker">«Юнга, который умеет обращаться с компасом, мне пригодится, — говорит Колумб. — Но в море нужны не только руки, но и голова. Ответишь на мои вопросы — пойдёшь с нами»</span>.']},
   {id:'t3', type:'choice', scene:'palos', who:'columbus',
    rv:{ids:[], bbox:[[-88,8],[2,46]], route:[[-6.9,37.2],[-17.2,28.1],[-45,26.5],[-74.5,24.05]], at:[-40,32], label:'Курс на запад'},
    q:'Колумб мечтает добраться до Индии и Китая — земель пряностей, шёлка и золота. Каким путём он решил туда плыть?',
    opts:['На запад, через Атлантический океан','На юг, вокруг Африки','По суше, Великим шёлковым путём','На север, через Ледовитый океан'], ans:0,
    hint:'Колумб был уверен, что Земля — шар. Значит, до востока можно добраться, если плыть…',
    exp:['Колумб рассуждал так: раз Земля круглая, до Азии можно доплыть, если всё время держать курс на запад.',
         'В том, что Земля — шар, образованные люди того времени не сомневались. Ошибка была в другом: Колумб считал Землю намного меньше, чем она есть, и думал, что Азия совсем близко. Об огромном материке посреди океана в Европе тогда не знали.',
         'Экспедицию оплатили испанские правители — король Фердинанд и королева Изабелла.'],
    card:{title:'Христофор Колумб', text:'Мореплаватель из Генуи на службе Испании. Искал западный путь в Азию — и открыл для европейцев Америку.'}},
   {type:'story', who:'sailor', text:['Пока вы грузите на «Пинту» бочки с водой, юнга рассказывает новости.',
     '<span class="speaker">«Знаешь, почему адмиралу наконец дали корабли? Он просил денег целых семь лет! Но короли были заняты войной»</span>.',
     '<span class="speaker">«Почти восемь веков назад, в 711 году, на наш полуостров переправились из Северной Африки мавры — мусульманские воины. Они захватили почти всю Испанию. С тех пор христианские королевства шаг за шагом отвоёвывали землю обратно. Это называют Реконкистой — по-испански „отвоевание“»</span>.',
     '<span class="speaker">«И вот в январе этого года пал последний мавританский город. Война закончилась, и у королевы Изабеллы появились деньги и время на плавание адмирала!»</span>']},
   {id:'t12', type:'choice', who:'sailor',

    exp:['Это Гранада — последнее мавританское государство на Пиренейском полуострове. 2 января 1492 года её правитель Боабдил передал ключи от города королю Фердинанду и королеве Изабелле.',
         'Реконкиста шла почти 800 лет — с 711 по 1492 год. Христиане постепенно возвращали один город за другим: Толедо в 1085 году, Кордову в 1236-м, Севилью в 1248-м. Гранада держалась дольше всех.',
         'Война была очень дорогой, и короли не могли тратить деньги на рискованные плавания. Сразу после победы, в апреле 1492 года, в военном лагере Санта-Фе у стен Гранады подписали договор с Колумбом.',

    card:{title:'Реконкиста', text:'Почти 800 лет (711–1492) христианские королевства отвоёвывали Пиренейский полуостров у мавров. Последней в январе 1492 года пала Гранада.'}},

   {id:'t5', type:'choice', scene:'ocean-day',

         'Отсюда удобно начинать путь на запад: в этих широтах постоянно дуют пассаты — устойчивые ветры, которые несут корабли от Африки к Америке.',

   {type:'story', scene:'tavern', who:'sebastian', text:['Таверна «Старый якорь» снова полна моряков. Себастьян ставит перед тобой кружку горячего какао и наклоняется поближе.',

   {type:'story', who:'hero', text:['<span class="speaker">«Сначала туман унёс меня в испанский порт Палос. Было 2 августа 1492 года. Я нанялась юнгой на каравеллу „Пинта“, и на рассвете три корабля Колумба — „Санта-Мария“, „Пинта“ и „Нинья“ — ушли на запад.</span>',

   {type:'story', who:'sebastian', text:['Себастьян смеётся и качает головой.',

   {type:'story', scene:'chest', who:'hero', text:['Ты открываешь сундук картографа и достаёшь компас. Едва ты читаешь вслух слова из атласа, стрелка вздрагивает и начинает медленно поворачиваться — на юго-восток, вдоль берегов Африки.',

   {type:'story', scene:'fog', text:['Ты крепко сжимаешь компас. Стрелка вращается всё быстрее, вокруг тебя закручивается золотой вихрь, и всё тонет в густом тумане…',

   {type:'story', scene:'palace', who:'vasco', hero:'vasco', text:['Туман рассеивается — и ты стоишь в огромном зале. Сквозь высокие окна видна широкая река и корабли с красными крестами на парусах. Вокруг говорят по-португальски.',

   {type:'story', scene:'map-room', who:'dias', hero:'dias', text:['Да Гама ведёт тебя в мастерскую картографов. Над картой Африки склонился седой моряк.',

   {type:'story', scene:'rio-bay', who:'pigafetta', text:['Через Атлантику флот идёт почти три месяца. 13 декабря 1519 года корабли входят в огромную бухту с зелёными горами и скалой, похожей на сахарную голову.',

     '<span class="speaker">«За один рыболовный крючок дают пять кур! — смеётся Пигафетта, торопливо записывая. — А эти фрукты, ананасы, сладкие, как мёд»</span>.']},

   {type:'story', scene:'patagonia', who:'pigafetta', text:['Чем дальше на юг, тем холоднее. В конце марта 1520 года флот останавливается на зимовку в бухте Сан-Хулиан. Здесь, на юге, зима начинается в апреле.',
     'Пасхальной ночью три испанских капитана поднимают бунт: они не хотят плыть дальше за португальцем. Магеллан быстро и жёстко подавляет мятеж. А разведчик «Сантьяго» разбивается о скалы — почти всех моряков удаётся спасти.',

   {id:'m10', type:'choice', who:'hero',
    q:'Патагонцы шьют плащи из шкур животного, похожего на верблюда без горбов. Оно пасётся на берегу целыми стадами. Кто это?',

         'Пигафетта описал гуанако как зверя «с головой мула, шеей верблюда и хвостом лошади». Для патагонцев гуанако давал мясо, шкуры и шерсть.'],

   {type:'story', scene:'strait', who:'magellan', text:['21 октября 1520 года флот находит узкий вход в залив у мыса, который Магеллан называет мысом Дев.',

   {type:'story', who:'hero', text:['На скале у выхода из пролива ты замечаешь знакомый знак — компас, такой же, как на сундуке картографа. В трещине камня спрятан обрывок бумаги:',
     '<span class="speaker">«1520. Я видел, как они выходили в великий океан. Земля круглая, юнга, — следуй за ними до конца. — А.»</span>',

   {id:'m12', type:'choice', who:'pigafetta',
    q:'Ночью на южном берегу пролива моряки видели множество костров и дымов местных жителей. Как сегодня называется эта земля?',

    exp:['Магеллан назвал её Землёй Дымов. А король Карл I, прочитав о плавании, решил: где дым, там и огонь, — и переименовал её в Огненную Землю. Сегодня это архипелаг Огненная Земля, он поделён между Чили и Аргентиной.',
         'Огни жгли местные жители, народ яганов и селькнамов. Несмотря на холод, они почти не носили одежды и грелись у костров, а огонь возили с собой даже в лодках.',

    card:{title:'Огненная Земля', text:'Архипелаг к югу от Магелланова пролива. Магеллан назвал его Землёй Дымов, король Карл I — Огненной Землёй.'}},

   {type:'story', scene:'pacific', who:'magellan', text:['28 ноября 1520 года три корабля выходят из пролива. Перед ними — огромный спокойный океан. Ни шторма, ни ветра, только синяя гладь.',

   {id:'m15', type:'choice', who:'hero', noShuffle:true,
    q:'Проходят недели, а земли всё нет. Сухари рассыпались в пыль с червями, вода протухла. Матросы размачивают и жарят кожу с мачт и ловят крыс. Верно ли, что так длилось больше трёх месяцев?',

         'Пигафетта записал, что крысу продавали за полдуката — огромные деньги. Многие моряки заболели цингой — той самой болезнью от нехватки витамина C, которую моряки да Гамы лечили апельсинами в Малинди.',

   {type:'story', scene:'guam', who:'pigafetta', text:['6 марта 1521 года впередсмотрящий хрипло кричит: «Земля!» Из воды поднимается зелёный остров с пальмами — сегодня он называется Гуам.',

     '<span class="speaker">«Свежая вода, рис, кокосы! — шепчет он, едва держа перо. — Мы спасены»</span>.']},

let cineTimer = 0, cineOn = false;
function startCine(name){
  const sec = innerWidth <= 900 ? 3.5 : 2.5;
  document.querySelector('#cineCap .place').textContent = SCENE_PLACE[name] || '';
  document.documentElement.style.setProperty('--cine', sec + 's');
  const bar = document.querySelector('#cineCap .bar i'); bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
  document.body.classList.add('cine'); cineOn = true;
  clearTimeout(cineTimer); cineTimer = setTimeout(endCine, sec * 1000);
}
function endCine(){
  if(!cineOn) return;
  cineOn = false; clearTimeout(cineTimer);
  document.body.classList.remove('cine');
  app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
  setTimeout(fitPortraits, 650);
}
document.getElementById('cineTap').addEventListener('click', e => {
  e.stopPropagation();
  if(cineOn) endCine(); else document.body.classList.remove('peek');
});
document.getElementById('eyeBtn').onclick = e => { e.stopPropagation(); if(cineOn) endCine(); document.body.classList.toggle('peek'); };
function showScene(name, opts){
  const m = SCENE_IMG[name];
  if(!m){ setScene(name); return; }
  if(imgScene !== name){
    document.documentElement.style.setProperty('--fx', SCENE_FOCUS[name] || '50%');
    const hasVid = FILES.vid ? FILES.vid.includes(m.file) : false;
    if((hasVid || CINE_IMG.includes(name)) && !(opts && opts.cine === false) && !cineSeen.has(name) && SCENE_PLACE[name]){ cineSeen.add(name); startCine(name); }
    else if(cineOn) endCine();
  }
  document.body.classList.remove('peek');
  imgScene = name;
  setAmbience(name);
  const chain = [m.file, ...(SCENE_ALT[name] || []), 'port-night', 'port-day', 'tavern', 'map'];
  (async () => { for(const f of chain){ const u = await findImg(f); if(u) return u; } return null; })().then(url => {
    if(imgScene !== name) return;
    if(!url){ setScene(m.fb); document.body.classList.remove('has-img'); return; }
    setScene(m.fb);
    document.body.classList.add('has-img');
    const L = document.querySelectorAll('#scenebg .simg');
    if(L[imgLayer].dataset.url === url && L[imgLayer].classList.contains('on')) return;
    const cur = document.getElementById('curtain');
    cur.classList.add('dark');
    imgLayer = 1 - imgLayer;
    const NL = L[imgLayer], OL = L[1-imgLayer];
    NL.classList.remove('cam-arrive','cam-sea','cam-kb','cam-still'); NL.style.transform = '';
    void NL.offsetWidth;
    NL.classList.add('pre', SCENE_CAM[name] || 'cam-kb');
    setFx(name);
    NL.style.backgroundImage = `url("${url}")`; NL.dataset.url = url;
    releaseVids(NL); NL.innerHTML = '';
    NL._gen = (NL._gen || 0) + 1; const oldGen = OL._gen;
    findVid(m.file).then(v => {
      if(!v || imgScene !== name || NL.dataset.url !== url) return;
      startVideoLoop(NL, v, m.file, () => imgScene === name && NL.dataset.url === url);
    });
    setTimeout(() => {
      NL.classList.add('on'); OL.classList.remove('on');
      /* освобождаем старый слой, только если его за это время не заняла новая сцена (иначе убьём её свежее видео) */
      setTimeout(() => { if(!OL.classList.contains('on') && OL._gen === oldGen) releaseVids(OL); }, 1500);
      requestAnimationFrame(() => NL.classList.remove('pre'));
      cur.classList.remove('dark');
    }, 280);
  });
}

  const sailFill = `fill="${c.color}" stroke="${ink}" stroke-width=".8"`;
  const light = `fill="#efe3c4" stroke="${ink}" stroke-width=".8"`;
  let rig = '', sails = '';
  const n = H.masts.length;
  H.masts.forEach(([mx, top], k) => {
    rig += `<line x1="${mx}" y1="${deck+2}" x2="${mx}" y2="${top}" stroke="#3a2a1a" stroke-width="${k === Math.floor(n/2) ? 3 : 2.4}"/>`;
    rig += `<path d="M${mx} ${top+2} L${x0+4} ${deck} M${mx} ${top+2} L${x1-6} ${deck-2}" stroke="${ink}" stroke-width=".45" opacity=".5"/>`;
    /* мачта, стоящая на надстройке: парус кончается над её крышей */
    const deck0 = deck;
    { const a = H.aft, f = H.fore; if(a && mx >= a[0] && mx <= a[1]) deck = a[2] + 2; else if(f && mx >= f[0] && mx <= f[1]) deck = f[2] + 2; }
    const span = (deck - top);
    const half = Math.min(22, 10 + span * 0.18);
    const isAft = k === 0 && n > 1;
    const lateen = c.sail === 'lateen' || (c.sail === 'mixed' && isAft) || (c.hull === 'sloop' && c.sail !== 'square');
    if(lateen){
      const yx = mx - half*1.4, yy = deck - 8, tx = mx + half*0.9, ty = top + 2;
      rig += `<line x1="${yx}" y1="${yy}" x2="${tx}" y2="${ty}" stroke="#3a2a1a" stroke-width="1.6"/>`;
      sails += `<path d="M${tx} ${ty} L${yx+2} ${yy-1} Q${mx+2} ${deck-4} ${mx+half*0.8} ${deck-6} Z" ${sailFill}/>`;
    } else {
      const y1 = top + 4, mid = top + span * 0.45, y2 = deck - 6;
      sails += `<path d="M${mx-half*0.7} ${y1} Q${mx} ${y1+3} ${mx+half*0.7} ${y1} L${mx+half*0.8} ${mid-2} Q${mx} ${mid+2} ${mx-half*0.8} ${mid-2} Z" ${sailFill}/>`;
      sails += `<path d="M${mx-half} ${mid+1} Q${mx} ${mid+5} ${mx+half} ${mid+1} L${mx+half*1.05} ${y2} Q${mx} ${y2+5} ${mx-half*1.05} ${y2} Z" ${sailFill}/>`;
      sails += `<path d="M${mx} ${mid+2} Q${mx+1} ${(mid+y2)/2} ${mx} ${y2}" stroke="#000" stroke-opacity=".15" stroke-width="2" fill="none"/>`;
    }
    deck = deck0;
  });
  /* бушприт и кливер */
  rig += `<line x1="${x1-14}" y1="${deck-1}" x2="${x1+12}" y2="${deck-12}" stroke="#3a2a1a" stroke-width="2"/>`;
  const fm = H.masts[n-1];
  sails += `<path d="M${fm[0]+2} ${fm[1]+8} L${x1+9} ${deck-11} L${fm[0]+6} ${deck-6} Z" ${light}/>`;
  /* флаг на грот-мачте */
  let flag = '';
  if(c.flag && FLAG_DRAW[c.flag]){ const mm = H.masts[Math.floor(n/2)]; flag = FLAG_DRAW[c.flag](mm[0], mm[1] - 11); }
  else { const mm = H.masts[Math.floor(n/2)]; flag = `<path d="M${mm[0]} ${mm[1]-2} L${mm[0]+12} ${mm[1]} L${mm[0]} ${mm[1]+2} Z" fill="${c.color}"/>`; }
  /* корпус */
  let hull = `<path d="M${x0} ${deck} L${x1} ${deck-4} Q${x1-6} ${bot-6} ${x1-30} ${bot} L${x0+16} ${bot} Q${x0-2} ${bot-4} ${x0} ${deck} Z" fill="${wood}" stroke="${ink}" stroke-width=".9"/>`;
  hull += `<path d="M${x0+2} ${deck+4} L${x1-4} ${deck}" stroke="${gold}" stroke-width="1.8"/>`;
  hull += `<path d="M${x0+10} ${bot-6} Q${(x0+x1)/2} ${bot-4} ${x1-26} ${bot-8}" stroke="#3b2414" stroke-width="1.1" fill="none"/>`;
  if(c.hull === 'nao' || c.hull === 'galleon'){
    let ports = '';
    const rows = c.hull === 'galleon' ? [8, 18] : [9];
    rows.forEach(dy => { for(let x = x0 + 30; x < x1 - 34; x += 13) ports += `<rect x="${x}" y="${deck+dy - (x-x0)*0.02}" width="5" height="4" rx=".6"/>`; });
    hull += `<g fill="#1d120a">${ports}</g>`;
  }
  if(c.hull === 'caravel'){ hull += `<path d="M${x0+4} ${deck+6} L${x1-10} ${deck+2}" stroke="#3b2414" stroke-width=".8"/>`; }
  if(c.hull === 'galleon'){
    hull += `<path d="M${x0+4} ${deck+14} L${x1-14} ${deck+10}" stroke="${gold}" stroke-width="1.2"/>`;
    hull += `<path d="M${x1-4} ${deck-4} L${x1+8} ${deck+2} L${x1-6} ${deck+6} Z" fill="${wood2}" stroke="${ink}" stroke-width=".7"/>`; /* клюв-гальюн */
  }
  /* кормовая и носовая надстройки */
  let castle = '';
  if(H.aft){
    const [a0, a1, top] = H.aft;
    castle += `<path d="M${a0-2} ${top} L${a1} ${top+4} L${a1} ${deck+1} L${a0} ${deck+2} Z" fill="${wood2}" stroke="${ink}" stroke-width=".8"/>`;
    castle += `<path d="M${a0-3} ${top-2} L${a1+1} ${top+2} L${a1+1} ${top+4} L${a0-2} ${top} Z" fill="${gold}"/>`;
    if(H.tiers){ /* двухъярусная корма: ступенька и балкон */
      castle += `<path d="M${a0} ${top+20} L${a1} ${top+22}" stroke="${gold}" stroke-width="1.3"/>`;
      castle += `<path d="M${a1} ${top+4} L${a1+10} ${top+14} L${a1+10} ${deck} L${a1} ${deck+1} Z" fill="${wood2}" stroke="${ink}" stroke-width=".7"/>`;
    }
  }
  if(H.fore){
    const [f0, f1, top] = H.fore;
    castle += `<path d="M${f0} ${top+3} L${f1} ${top} L${f1-2} ${deck-3} L${f0} ${deck-1} Z" fill="${wood2}" stroke="${ink}" stroke-width=".8"/>`;
  }
  /* корма: варианты */
  let stern = '';
  const sx = H.aft ? H.aft[0] : x0 + 4, sTop = H.aft ? H.aft[2] : deck - 4;
  if(c.stern === 'carved'){
    stern += `<g fill="#ffd36b" stroke="${ink}" stroke-width=".4">`;
    const rows = H.aft ? 2 : 1;
    for(let r = 0; r < rows; r++) for(let k = 0; k < 3; k++) stern += `<rect x="${sx+6+k*8}" y="${sTop+6+r*9}" width="5" height="5" rx="1"/>`;
    stern += `</g><path d="M${sx-3} ${sTop+3} Q${sx+14} ${sTop-6} ${sx+30} ${sTop+5}" stroke="${gold}" stroke-width="1.6" fill="none"/>`;
    stern += `<path d="M${sx-2} ${deck-2} Q${sx-8} ${deck+6} ${sx+2} ${deck+12}" stroke="${gold}" stroke-width="1.4" fill="none"/>`;
  }
  if(c.stern === 'lantern' || c.stern === 'carved'){
    const lx = sx - 1, ly = sTop - 4;
    stern += `<line x1="${lx}" y1="${ly+4}" x2="${lx}" y2="${ly-6}" stroke="#3a2a1a" stroke-width="1.2"/><rect x="${lx-3}" y="${ly-13}" width="6" height="8" rx="1.5" fill="#ffcf5a" stroke="${ink}" stroke-width=".7"/>`;
    if(!(opts && opts.flat)) stern += `<circle cx="${lx}" cy="${ly-9}" r="7" fill="#ffd36b" opacity=".25"/>`;
  }
  /* носовая фигура */
  let fig = '';
  const fx = x1 - 1, fy = deck - 3;
  if(c.fig === 'dolphin') fig = `<path d="M${fx} ${fy} Q${fx+9} ${fy-9} ${fx+15} ${fy-4} Q${fx+10} ${fy-3} ${fx+8} ${fy+2} Q${fx+4} ${fy+3} ${fx} ${fy+2} Z" fill="#6c8ea8" stroke="${ink}" stroke-width=".6"/><circle cx="${fx+11}" cy="${fy-5}" r=".8" fill="#111"/>`;
  if(c.fig === 'seahorse') fig = `<path d="M${fx} ${fy+2} Q${fx+5} ${fy-2} ${fx+6} ${fy-8} Q${fx+7} ${fy-13} ${fx+12} ${fy-12} L${fx+15} ${fy-10} L${fx+11} ${fy-9} Q${fx+10} ${fy-4} ${fx+6} ${fy+1} Q${fx+3} ${fy+5} ${fx} ${fy+4} Z" fill="${gold}" stroke="${ink}" stroke-width=".6"/>`;
  if(c.fig === 'mermaid') fig = `<path d="M${fx} ${fy+3} Q${fx+6} ${fy} ${fx+8} ${fy-6} Q${fx+9} ${fy-11} ${fx+12} ${fy-12} Q${fx+13} ${fy-8} ${fx+11} ${fy-5} Q${fx+9} ${fy} ${fx+3} ${fy+5} Z" fill="#3f8f84" stroke="${ink}" stroke-width=".6"/><circle cx="${fx+12}" cy="${fy-14}" r="2.4" fill="#e9c39b" stroke="${ink}" stroke-width=".5"/><path d="M${fx+10} ${fy-15} Q${fx+8} ${fy-10} ${fx+9} ${fy-7}" stroke="#b5532c" stroke-width="1.6" fill="none"/>`;
  if(c.fig === 'penguin') fig = `<ellipse cx="${fx+7}" cy="${fy-4}" rx="4.5" ry="7" fill="#1e1e1e"/><ellipse cx="${fx+8}" cy="${fy-3}" rx="2.6" ry="5" fill="#f4f1e8"/><circle cx="${fx+8}" cy="${fy-9}" r="2.6" fill="#1e1e1e"/><path d="M${fx+10} ${fy-9} L${fx+13} ${fy-8} L${fx+10} ${fy-7.5} Z" fill="#e0a43a"/>`;
  /* трофеи на палубе */
  let tro = '';
  (c.deck || []).forEach((t, k) => { if(TROPHY_DRAW[t]) tro += TROPHY_DRAW[t](x0 + 28 + k * 20 + (H.aft ? 42 : 10), deck - 6); });
  /* кадр по размеру корабля, чтобы маленький шлюп не терялся */
  const minTop = Math.min(...H.masts.map(m => m[1])) - 16;
  const vx = x0 - 22, vw = (x1 + 26) - vx, vy = minTop, vh = bot + 6 - vy;
  /* вода строго в пределах кадра (иначе проверка наложений видит выход за край) */
  const wv = (y, amp) => { let d = `M${vx} ${y}`; for(let x = vx; x < vx + vw; x += 25) d += ` Q${Math.min(x+12.5, vx+vw)} ${y-amp} ${Math.min(x+25, vx+vw)} ${y}`; return d; };
  const water = (opts && opts.flat) ? '' : `<path d="${wv(bot-6, 4)} L${vx+vw} ${vy+vh} L${vx} ${vy+vh} Z" fill="#2c6e9e" opacity=".35"/><path d="${wv(bot-2, 4)}" stroke="#e8f3ff" stroke-opacity=".6" fill="none"/>`;
  return `<svg viewBox="${vx} ${vy} ${vw} ${vh}" width="${w}" height="${Math.round(w*vh/vw)}" aria-label="Твой корабль">${rig}${sails}${flag}${castle}${hull}${stern}${fig}${tro}${water}</svg>`;
}

/* Корабль игрока: картинка корпуса + «чертёж» с купленными деталями; без картинки (киль) — только рисунок */
function shipView(cfg, w, planW){
  const ext = FILES.img['yard-' + cfg.hull];
  if(!ext) return shipSVG(cfg, w);
  return `<div class="shview" style="max-width:${w}px"><img class="shphoto" src="img/yard-${cfg.hull}.${ext}" alt="Твой корабль">
    <div class="shplan"><span>Чертёж корабельщика</span>${shipSVG(cfg, planW, {flat:true})}</div></div>`;
}

/* ---------- Экран верфи ---------- */
let yardTab = 'hull';
function renderShipyard(){
  ensureYard();
  showScene('port-day');
  setSpeaker(null);
  const Y = state.yard, cfg = shipCfg();
  const keel = Y.eq.hull === 'keel';
  const tabs = Object.entries(YARD).map(([k, v]) => [k, v.name]).concat([['trophies','Трофеи'], ['name','Название']]);
  let list = '';
  if(yardTab === 'trophies'){
    const got = Object.values(TROPHIES).filter(t => Y.trophies.includes(t.id));
    list = got.length ? got.map(t => `<div class="ycard${Y.deck.includes(t.id) ? ' on' : ''}">
        <div class="yprev">${shipSVG(Object.assign({}, cfg, {deck:[t.id]}), 120, {flat:true})}</div>
        <div class="yinfo"><b>${t.n}</b><p>${t.d}</p>
        <button class="btn small${Y.deck.includes(t.id) ? ' ghost' : ''}" data-deck="${t.id}">${Y.deck.includes(t.id) ? 'Убрать с палубы' : 'Поставить на палубу'}</button></div></div>`).join('')
      : '<p class="muted">Трофеи выдаются за каждое пройденное плавание. Пройди главу — и привезёшь первый!</p>';
  } else if(yardTab === 'name'){
    list = `<div class="yname">
      <label for="ynm">Имя капитана</label><input type="text" id="ynm" maxlength="30" value="${esc(state.player.name)}">
      <label for="ysh">Название корабля</label><input type="text" id="ysh" maxlength="30" value="${esc(state.player.ship)}">
      <div class="chips">${SHIP_IDEAS.map(s => `<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
      <label>Цвет парусов</label>
      <div class="swatches">${SAILS.map(s => `<div class="sw${s.c === state.player.color ? ' sel' : ''}" data-c="${s.c}" title="${s.n}" style="background:${s.c}"></div>`).join('')}</div>
      <div class="row"><button class="btn" id="ysave">Сохранить</button><span class="muted" id="ysaved" style="font-size:14px"></span></div></div>`;
  } else {
    const cat = YARD[yardTab];
    const firstFlag = yardTab === 'flag' && Y.own.flag.length === 0;
    list = cat.items.map(it => {
      if(it.id === 'keel' && Y.own.hull.length > 1) return '';
      const have = Y.own[yardTab].includes(it.id);
      const isEq = yardTab !== 'tools' && Y.eq[yardTab] === it.id;
      const price = firstFlag ? 0 : it.price;
      const prevCfg = yardTab === 'tools' ? null : Object.assign({}, cfg, {[yardTab]: it.id}, keel && yardTab !== 'hull' ? {hull:'sloop'} : {});
      let act;
      if(yardTab === 'tools') act = have ? '<span class="yown">✓ Есть на борту</span>' : `<button class="btn small" data-buy="${it.id}" ${state.gold < price ? 'disabled' : ''}>Купить · ${price} ●</button>`;
      else if(isEq) act = '<span class="yown">✓ Стоит на корабле</span>';
      else if(have) act = `<button class="btn small ghost" data-eq="${it.id}">Поставить</button>`;
      else if(it.gift) act = '<span class="muted" style="font-size:14px">Подарок Себастьяна за первое плавание</span>';
      else if(keel && yardTab !== 'hull') act = '<span class="muted" style="font-size:14px">Сначала нужен корпус</span>';
      else act = `<button class="btn small" data-buy="${it.id}" ${state.gold < price ? 'disabled' : ''}>Купить · ${price ? price + ' ●' : 'бесплатно'}</button>`;
      return `<div class="ycard${isEq || (yardTab === 'tools' && have) ? ' on' : ''}">
        <div class="yprev">${yardTab === 'hull' && FILES.img['yard-' + it.id] ? `<img class="yphoto" src="img/yard-${it.id}.${FILES.img['yard-' + it.id]}" alt="${esc(it.n)}" loading="lazy">` : prevCfg ? shipSVG(prevCfg, 120, {flat:true}) : `<div class="ytool">${TOOL_ICON[it.id] || ''}</div>`}</div>
        <div class="yinfo"><b>${it.n}</b><p>${it.d}</p>${act}</div></div>`;
    }).join('');
  }
  app.innerHTML = `${topbar()}
    <div class="card">
      <h2>Верфь Тортуги</h2>
      <div class="yship">${shipView(cfg, 360, 200)}</div>
      <p class="muted center" style="margin:4px 0 0">${keel ? 'Твой будущий корабль пока на стапеле. Пройди первое плавание — и Себастьян подарит корпус шлюпа.' : `«${esc(state.player.ship)}» · ${YARD.hull.items.find(i => i.id === Y.eq.hull).n}`}</p>
    </div>
    <div class="card">
      <div class="chips ytabs">${tabs.map(([k, n]) => `<button class="chip${k === yardTab ? ' sel' : ''}" data-tab="${k}">${n}</button>`).join('')}</div>
      <div class="ylist">${list}</div>
    </div>
    <div class="row"><button class="btn" id="yback">Назад в порт</button></div>`;
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { yardTab = b.dataset.tab; renderShipyard(); });
  app.querySelectorAll('[data-eq]').forEach(b => b.onclick = () => { Y.eq[yardTab] = b.dataset.eq; save(); sfx('click'); renderShipyard(); });
  app.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const it = YARD[yardTab].items.find(i => i.id === b.dataset.buy);
    const price = (yardTab === 'flag' && Y.own.flag.length === 0) ? 0 : it.price;
    if(state.gold < price) return;
    state.gold -= price; Y.own[yardTab].push(it.id);
    if(yardTab !== 'tools') Y.eq[yardTab] = it.id;
    save(); sfx('coin'); renderShipyard();
  });
  app.querySelectorAll('[data-deck]').forEach(b => b.onclick = () => {
    const t = b.dataset.deck, i = Y.deck.indexOf(t);
    if(i >= 0) Y.deck.splice(i, 1); else Y.deck.push(t);
    save(); renderShipyard();
  });
  if(yardTab === 'name'){
    let color = state.player.color;
    app.querySelectorAll('.yname .chip').forEach(b => b.onclick = () => { document.getElementById('ysh').value = b.dataset.s; });
    app.querySelectorAll('.yname .sw').forEach(s => s.onclick = () => { app.querySelectorAll('.yname .sw').forEach(x => x.classList.remove('sel')); s.classList.add('sel'); color = s.dataset.c; });
    document.getElementById('ysave').onclick = () => {
      const nm = document.getElementById('ynm').value.trim(), sh = document.getElementById('ysh').value.trim();
      if(!nm || !sh){ document.getElementById('ysaved').textContent = ' Имя и название не могут быть пустыми'; return; }
      state.player.name = nm; state.player.ship = sh; state.player.color = color; save(); renderShipyard();
    };
  }
  document.getElementById('yback').onclick = () => { renderHub(); goTop(); };
}

/* ===================== ЭКРАНЫ ===================== */
function restartGame(){
  if(!confirm('Начать игру сначала? Прогресс, золото и судовой журнал будут стёрты.')) return;
  const snd = state.sound;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  state = newState(); state.sound = snd; save(); start(); goTop();
}
document.addEventListener('click', e => { if(e.target.closest('#restartBtn')) restartGame(); });

const SCENE_SND = {

  'sunset-port':'sunset-port', 'map':'cabin', 'cabin':'cabin',
  'palos':'palos', 'taino-village':'island', 'hispaniola':'hispaniola', 'eclipse':'ocean-night', /* в звуке деревни и Ямайки была речь — берём чистый фон соседних сцен */
  'chest-closed':'tavern', 'chest-open':'tavern', 'palace':'palace', 'map-room':'map-room', 'lisbon':'lisbon', 'cape-verde':'cape-verde', 'southern-sky':'southern-sky',
  'cape-storm':'cape-storm', 'penguin-coast':'penguin-coast', 'malindi':'malindi', 'calicut':'calicut',
  /* глава 3 пока на картинках — звук берём из похожих сцен */
  'sargasso':'ocean-day', 'seville':'palos', 'sanlucar':'lisbon', 'rio-bay':'island', 'la-plata':'ocean-day', 'guam':'island', 'cebu':'island', 'victoria-cape':'cape-storm', 'cape-verde-1522':'cape-verde', 'patagonia':'southern-sky', 'strait':'ocean-night',

/* Пока файла нет, море и волшебный гул генерируются прямо в браузере */
const SYNTH_FOR = {'ocean-night':'sea','island':'sea','port-day':'sea','port-night':'sea','ocean-day':'sea','sunset-port':'sea','fog':'magic'};
const AMB_VOL = 0.45;
const SND = {ctx:null, want:null, playing:null, el:null, synth:null, unlocked:false, cache:{}};
function sndOn(){ return state.sound !== false; }
function actx(){
  if(!SND.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; SND.ctx = new C(); }
  if(SND.ctx.state === 'suspended') SND.ctx.resume();
  return SND.ctx;
}
function findSnd(file){
  if(FILES.snd){ if(SND.cache[file] === undefined) SND.cache[file] = Promise.resolve(FILES.snd.includes(file) ? `snd/${file}.mp3` : null); return SND.cache[file]; }
  if(SND.cache[file] !== undefined) return SND.cache[file];
  SND.cache[file] = new Promise(res => {
    const exts = ['mp3','ogg','wav','m4a'];
    (function tryNext(i){
      if(i >= exts.length) return res(null);
      const a = new Audio(); let done = false;
      const ok = () => { if(done) return; done = true; res(`snd/${file}.${exts[i]}`); };
      const bad = () => { if(done) return; done = true; tryNext(i+1); };
      a.addEventListener('loadedmetadata', ok, {once:true});
      a.addEventListener('error', bad, {once:true});
      setTimeout(bad, 2500);
      a.preload = 'metadata'; a.src = `snd/${file}.${exts[i]}`;
    })(0);
  });

}
function fadeEl(el, to, ms, after){
  const from = el.volume, t0 = performance.now();
  (function step(t){
    const k = Math.min(1, Math.max(0, (t - t0) / ms));
    el.volume = Math.max(0, Math.min(1, from + (to - from) * k));
    if(k < 1) requestAnimationFrame(step); else if(after) after();
  })(t0);
}
/* Бесшовный повтор: два плеера по очереди, конец одного растворяется в начало другого */
function audioLoop(url){
  const XF = 1.6;
  const mk = () => { const a = new Audio(url); a.volume = 0; a.preload = 'auto'; return a; };
  const A = mk(), B = mk();
  let cur = A, other = B, swapping = false, dead = false;
  const tick = () => {
    if(dead || swapping || !cur.duration || cur.currentTime < cur.duration - XF - .1) return;
    swapping = true;
    const nxt = other, prev = cur;
    nxt.currentTime = 0; nxt.volume = 0;
    nxt.play().then(() => {
      fadeEl(nxt, AMB_VOL, XF * 1000);
      fadeEl(prev, 0, XF * 1000, () => { prev.pause(); cur = nxt; other = prev; swapping = false; });
    }).catch(() => { swapping = false; });
  };
  A.addEventListener('timeupdate', tick); B.addEventListener('timeupdate', tick);
  A.play().then(() => fadeEl(A, AMB_VOL, 1800)).catch(() => {});
  /* после остановки освобождаем плееры: в Safari число одновременно открытых медиа ограничено */
  const free = a => { try{ a.pause(); a.removeAttribute('src'); a.load(); }catch(e){} };
  return { stop(ms){ dead = true; [A,B].forEach(a => { if(!a.paused) fadeEl(a, 0, ms, () => free(a)); else free(a); }); } };
}
function stopSynth(){
  const s = SND.synth; SND.synth = null;
  if(!s || !SND.ctx) return;
  const c = SND.ctx;
  s.out.gain.cancelScheduledValues(c.currentTime);
  s.out.gain.setTargetAtTime(0, c.currentTime, .5);
  setTimeout(() => s.nodes.forEach(n => { try{ n.stop(); }catch(e){} }), 2500);
}
function startSynth(kind){
  const c = actx(); if(!c) return;
  const out = c.createGain(); out.gain.value = 0; out.connect(c.destination);
  const nodes = [];
  if(kind === 'sea'){
    const len = c.sampleRate * 4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let last = 0; for(let i=0;i<len;i++){ const w = Math.random()*2-1; last = (last + .02*w)/1.02; d[i] = last*3.5; }
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650;
    const swell = c.createGain(); swell.gain.value = .55;
    const lfo = c.createOscillator(); lfo.frequency.value = .11;
    const lfoG = c.createGain(); lfoG.gain.value = .45;
    lfo.connect(lfoG); lfoG.connect(swell.gain);
    src.connect(lp); lp.connect(swell); swell.connect(out);
    src.start(); lfo.start(); nodes.push(src, lfo);
    out.gain.setTargetAtTime(.5, c.currentTime, .8);
  } else if(kind === 'magic'){
    [196, 246.9, 293.7, 392].forEach((f,i) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.detune.value = (i%2 ? 7 : -7);
      const g = c.createGain(); g.gain.value = .05;
      const l = c.createOscillator(); l.frequency.value = .15 + i*.07;
      const lg = c.createGain(); lg.gain.value = .035; l.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(out); o.start(); l.start(); nodes.push(o, l);
    });
    out.gain.setTargetAtTime(.6, c.currentTime, 1);
  }
  SND.synth = {kind, out, nodes};
}
function setAmbience(scene){
  SND.want = SCENE_SND[scene] || null;
  applyAmbience();
}
function applyAmbience(){
  const want = sndOn() && SND.unlocked ? SND.want : null;
  if(want === SND.playing) return;
  SND.playing = want;
  if(SND.el){ const old = SND.el; SND.el = null; old.stop(1500); }
  stopSynth();
  if(!want) return;
  findSnd(want).then(url => {
    if(SND.playing !== want) return;
    if(url){ SND.el = audioLoop(url); }
    else if(SYNTH_FOR[want]){ startSynth(SYNTH_FOR[want]); }
  });
}
function sfx(kind){
  if(!sndOn() || !SND.unlocked) return;
  const c = actx(); if(!c) return;
  const t = c.currentTime;
  const tone = (f, at, dur, type, vol) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t+at); g.gain.linearRampToValueAtTime(vol || .18, t+at+.015);
    g.gain.exponentialRampToValueAtTime(.0001, t+at+dur);
    o.connect(g); g.connect(c.destination); o.start(t+at); o.stop(t+at+dur+.05);
  };
  if(kind === 'click') tone(880, 0, .06, 'triangle', .05);
  if(kind === 'ok'){ tone(784,0,.35); tone(988,.09,.35); tone(1175,.18,.5); }
  if(kind === 'bad'){ tone(220,0,.35,'triangle',.2); tone(174,.14,.45,'triangle',.18); }
  if(kind === 'coin'){ tone(1568,0,.12,'square',.05); tone(2093,.07,.25,'square',.05); }
  if(kind === 'fanfare'){ [523,659,784,1047].forEach((f,i) => tone(f, i*.12, .5, 'triangle', .14)); tone(1047,.5,.9,'sine',.12); }
}

/* На телефоне герои стоят под карточкой и занимают только свободное место; если места нет — прячутся */
function fitPortraits(){
  const root = document.documentElement;
  if(innerWidth > 900 || innerHeight <= 520){ document.body.classList.remove('noport'); return; }
  let bottom = 0;
  [...app.children].forEach(el => { if(!el.classList.contains('foot')) bottom = Math.max(bottom, el.getBoundingClientRect().bottom); });
  const avail = innerHeight - bottom - 6;
  if(avail < 170){ document.body.classList.add('noport'); }
  else { document.body.classList.remove('noport'); root.style.setProperty('--ph', Math.round(Math.min(avail, innerHeight * .6)) + 'px'); }
}
let fitT = 0;
const fitSoon = () => { cancelAnimationFrame(fitT); fitT = requestAnimationFrame(fitPortraits); };
new ResizeObserver(fitSoon).observe(app);
addEventListener('resize', fitSoon); addEventListener('scroll', fitSoon, {passive:true});
setInterval(() => { if(innerWidth <= 900) fitPortraits(); }, 400); /* подстраховка: текст в карточке может меняться без смены экрана */

new MutationObserver(() => { app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); setTimeout(fitPortraits, 650); })
