<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Атлас пропавшего картографа</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14303f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Атлас">
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
:root{
  --bg:#14303f;--bg2:#1f4a5e;--parch:#f4e8cc;--paper:#fffaf0;--ink:#3a2a1a;--ink2:#6b5640;
  --line:#c9b285;--accent:#9c4a24;--gold:#c08a1e;--ok:#2f7a4a;--okbg:#e3efdc;--bad:#a23b2f;--badbg:#f6e0da;
  --sea:#a9c9cc;--land:#efe2c2;--fog:#d9d0bd;--rev:#c99e4e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%);background-attachment:fixed;min-height:100vh;
  color:var(--ink);font-family:'PT Serif',Georgia,serif;font-size:17px;line-height:1.55}
#app{max-width:720px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:'Philosopher',Georgia,serif;margin:0 0 .5em;line-height:1.2}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px}
p{margin:0 0 .8em}
.card{background:var(--parch);border:1px solid var(--line);border-radius:14px;padding:20px;
  box-shadow:0 10px 28px rgba(0,0,0,.28);margin-bottom:16px}
.muted{color:var(--ink2)}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{font-family:'Philosopher',Georgia,serif;font-weight:700;font-size:17px;background:var(--accent);color:#fff8ec;
  border:0;border-radius:10px;padding:12px 20px;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{font-size:15px;min-height:40px;padding:8px 14px}
.btn.wide{width:100%}
.topbar{display:flex;align-items:center;gap:10px;color:var(--parch);margin-bottom:14px;flex-wrap:wrap}
.topbar .who{flex:1;min-width:0}
.topbar .ship{font-family:'Philosopher',serif;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .cap{font-size:14px;opacity:.8}
.restart{font:inherit;font-size:14px;background:transparent;color:var(--parch);border:1px solid rgba(244,232,204,.5);border-radius:20px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.restart:hover{background:rgba(244,232,204,.15)}
.gold{background:rgba(192,138,30,.2);border:1px solid var(--gold);color:#f1d48a;border-radius:20px;padding:4px 12px;font-weight:700;white-space:nowrap}
.story p{font-size:18px}
.story .speaker{font-style:italic;color:var(--ink2)}
label{display:block;font-weight:700;margin:14px 0 6px}
input[type=text]{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font:inherit;font-size:15px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:20px;padding:8px 14px;cursor:pointer}
.chip.used{opacity:.4}
.swatches{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.sw.sel{border-color:var(--ink)}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;
  padding:12px 14px;margin:8px 0;cursor:pointer;color:var(--ink);min-height:48px}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.progress{height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin-bottom:14px}
.progress div{height:100%;background:var(--gold)}
.tasknum{font-size:14px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.q{font-size:19px;margin:6px 0 10px}
.hint{background:#efe0bb;border-left:4px solid var(--gold);padding:10px 12px;border-radius:6px;font-style:italic;margin:10px 0}
.fb{border-radius:12px;padding:16px;margin-top:14px;border:1.5px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb.neutral{background:#efe6d2;border-color:var(--line)}
.fb .reward{font-weight:700;color:var(--gold)}
.fb .newcard{font-size:15px;color:var(--ink2)}
.slot{background:var(--paper);border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}
.slot.ok{border:1.5px solid var(--ok);background:var(--okbg)}
.slot.no{border:1.5px solid var(--bad);background:var(--badbg)}
.mrow{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;font:inherit;background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer;color:var(--ink)}
.mrow span{font-size:15px;color:var(--ink2)}
.mrow.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(156,74,36,.25)}
.mrow.ok{border-color:var(--ok);background:var(--okbg)}
.mrow.no{border-color:var(--bad);background:var(--badbg)}
.mapbox{width:100%;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);background:var(--sea);touch-action:manipulation}
.mapbox svg{display:block;cursor:crosshair}
.sea{fill:var(--sea)}
.grat{fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:.5}
.land{stroke:#a89874;stroke-width:.4}
.land.plain{fill:var(--land)}
.land.fog{fill:var(--fog)}
.land.revealed{fill:var(--rev)}
.route{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-dasharray:6 4}
.maplabel{font-family:'PT Serif',serif;font-style:italic;font-size:12px;fill:#2c4a55}
.chapter{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);margin:8px 0}
.chapter.locked{opacity:.55}
.chapter .num{font-family:'Philosopher',serif;font-weight:700;font-size:22px;width:36px;height:36px;border-radius:50%;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.chapter.locked .num{background:#9b8d73}
.chapter .info{flex:1;min-width:0}
.chapter .t{font-weight:700}
.chapter .s{font-size:14px;color:var(--ink2)}
.badge{font-size:13px;color:var(--ok);font-weight:700}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.jcard{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px}
.jcard h3{font-size:17px;margin-bottom:4px}
.jcard p{font-size:15px;margin:0}
.jcard.locked{display:flex;align-items:center;justify-content:center;color:var(--ink2);font-style:italic;min-height:90px;border-style:dashed}
.foot{text-align:center;margin-top:20px}
.linkbtn{background:none;border:0;color:var(--parch);opacity:.6;font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
@media (max-width:480px){h1{font-size:26px}.card{padding:16px}.q{font-size:18px}}

/* ===== Персонажи ===== */
.portrait{position:fixed;bottom:0;height:84vh;width:calc((100vw - 760px)/2 - 6px);max-width:44vw;object-fit:contain;
  z-index:1;pointer-events:none;opacity:0;transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1), filter .5s ease;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}
#pL{left:0;object-position:bottom center;transform:translateX(-60px)}
#pR{right:0;object-position:bottom center;transform:translateX(60px)}
#pL.on,#pR.on{opacity:1;transform:none}
.portrait.flip{scale:-1 1}
.portrait.dim{filter:drop-shadow(0 12px 22px rgba(0,0,0,.6)) brightness(.55) saturate(.7)}
.portrait.on:not(.dim){animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{translate:0 0}50%{translate:0 -6px}}
@media (max-width:900px){
  .portrait{height:var(--ph,40vh);width:52vw;max-width:none;filter:none!important;animation:none!important}
  .portrait.dim{opacity:0!important}
  #pR{width:56vw}
  body.noport .portrait{opacity:0!important}
  .title-card{background:var(--parch);margin-top:6vh}
  .topbar,.linkbtn,#sndBtn,#fsBtn{backdrop-filter:none!important}
  #app{padding-top:calc(54px + env(safe-area-inset-top))}
  #sndBtn,#fsBtn{position:absolute!important;width:38px!important;height:38px!important;font-size:17px!important;bottom:auto!important;top:max(8px, env(safe-area-inset-top))!important}
  #sndBtn{right:8px!important} #fsBtn{right:52px!important}
  .topbar{flex-wrap:nowrap;padding:6px 10px;gap:8px}
  .topbar svg{width:34px;height:34px}
  .topbar .ship{font-size:17px}
  .topbar .cap{font-size:12px}
  .topbar .rtxt{display:none}
  .gold{padding:3px 9px;font-size:14px}
  .title-card{margin-right:0}
  .simg{animation:none!important}
}
body.standalone #fsBtn{display:none!important}
@media (max-width:900px){
  #eyeBtn{position:absolute!important;width:38px!important;height:38px!important;font-size:16px!important;top:max(8px, env(safe-area-inset-top))!important;right:96px!important}
  body.standalone #eyeBtn{right:52px!important}
  .card{padding:14px 15px}
  body{font-size:16px}
  .story p{font-size:16px}
  .q{font-size:17px}
  .opt{padding:10px 12px;min-height:44px;margin:6px 0}
  .fb{padding:12px}
  .title-card h1{font-size:32px}
  #cineCap .place{font-size:18px;padding:8px 16px}
}
/* ===== Подсказка повернуть телефон ===== */
#rotate{display:none;position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at top,#1f3b55,#08121f 75%);color:#f4e8cc;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#rotate .rot-ico{font-size:64px;animation:rotIco 2.4s ease-in-out infinite}
@keyframes rotIco{0%,25%{transform:rotate(0)}50%,75%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rotate .rot-t{font-family:'Philosopher',serif;font-size:24px;font-weight:700;margin-top:18px}
#rotate .rot-s{opacity:.75;margin-top:6px;font-size:15px}
#rotate button{margin-top:28px;background:none;border:0;color:#f4e8cc;opacity:.6;text-decoration:underline;font:inherit;font-size:14px}
@media (orientation:portrait){ body.phone:not(.rotok) #rotate{display:flex} }
/* ===== Горизонтальный телефон: видео слева, текст панелью справа ===== */
@media (orientation:landscape) and (max-height:520px){
  #scenebg,#fx{right:44vw;transition:right .6s ease}
  body.cine #scenebg, body.peek #scenebg, body.cine #fx, body.peek #fx{right:0}
  .simg{inset:0!important;animation:none!important;background-position:var(--fx,50%) center!important}
  .svid{object-position:var(--fx,50%) center}
  .svig{background:linear-gradient(90deg,rgba(0,0,0,0) 70%,rgba(0,0,0,.55))}
  .portrait{height:82vh!important;width:24vw!important;max-width:none!important;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))!important}
  #pL{left:0!important;object-position:bottom center!important}
  #pR{right:44vw!important;left:auto!important;object-position:bottom center!important}
  body.noport .portrait.on{opacity:1!important}
  .portrait.dim{opacity:1!important;filter:brightness(.55) saturate(.7)!important}
  #app{width:44vw!important;max-width:none!important;margin:0!important;padding:8px 10px 24px 6px!important;
    position:fixed!important;top:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  body{font-size:15px}
  .card{padding:12px 14px!important;margin-bottom:10px;border-radius:12px}
  h2{font-size:20px} h3{font-size:17px}
  .story p{font-size:15px!important}
  .q{font-size:16px!important}
  .opt{padding:8px 11px!important;min-height:40px!important;margin:5px 0!important}
  .btn{min-height:42px;padding:9px 16px;font-size:16px}
  .speakerbar{margin-bottom:8px} .ava{width:46px!important;height:46px!important}
  .topbar{padding:5px 9px!important;gap:7px!important;flex-wrap:nowrap!important}
  .topbar svg{width:30px;height:30px} .topbar .ship{font-size:15px!important} .topbar .cap{font-size:11px!important}
  .topbar .rtxt{display:none} .gold{font-size:13px;padding:2px 8px}
  .title-card{margin-top:4vh!important;padding:18px 16px!important}
  .title-card h1{font-size:24px!important} .title-card .btn{min-width:0;width:100%}
  #sndBtn,#fsBtn,#eyeBtn{position:fixed!important;top:8px!important;right:auto!important;bottom:auto!important;width:38px!important;height:38px!important;font-size:16px!important}
  #eyeBtn{left:8px!important} #fsBtn{left:52px!important} #sndBtn{left:96px!important}
  body.standalone #sndBtn{left:52px!important}
  #cineCap .place{font-size:18px;padding:8px 18px}
  #cineCap{bottom:16px}
  .mapbox svg{max-width:100%}
}
/* на вертикальном экране держим в кадре главное в каждой сцене */
@media (orientation:portrait) and (max-width:900px){
  .simg{background-position:var(--fx,50%) center!important}
  .svid{object-position:var(--fx,50%) center}
}

.speakerbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ava{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#e6d3a8;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.speakerbar b{font-family:'Philosopher',serif;font-size:18px;color:var(--accent)}
/* ===== Атлас-пергамент ===== */
.mapbox{background:#e8d6ad;border:2px solid #8a6a3e;box-shadow:inset 0 0 40px rgba(110,70,30,.45)}
.sea{fill:#e8d6ad}
.grat{stroke:#8a6a3e;stroke-opacity:.25}
.land{stroke:#6b4a2a;stroke-width:.6}
.land.plain{fill:#cfae78}
.land.fog{fill:#d9c49a;stroke-opacity:.35}
.land.revealed{fill:#b5793d}
.route{stroke:#9c2a1e;stroke-width:2.4}
.maplabel{fill:#5a3c1e;font-size:13px}
/* ===== Картинки сцен ===== */
#scenebg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s}
body.has-img #scenebg{opacity:1}
#bg{display:none!important}
body{background:radial-gradient(ellipse at top,#1f3b55,#08121f 75%) fixed}
#bg{transition:opacity 1.2s}
/* переходы */
/* показ сцены перед текстом и режим «посмотреть сцену» */
#app,.portrait{transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
body.cine #app, body.peek #app{opacity:0!important;transform:translateY(40px);pointer-events:none}
body.cine .portrait, body.peek .portrait{opacity:0!important}
#cineCap{position:fixed;left:0;right:0;bottom:max(7vh, calc(24px + env(safe-area-inset-bottom)));z-index:4;text-align:center;pointer-events:none;
  opacity:0;transform:translateY(16px);transition:opacity .7s ease, transform .7s ease}
body.cine #cineCap{opacity:1;transform:none}
#cineCap .place{display:inline-block;font-family:'Philosopher',serif;font-weight:700;font-size:22px;color:#f7ecd2;
  background:rgba(8,18,31,.6);padding:10px 22px;border-radius:30px;border:1px solid rgba(232,198,106,.6);text-shadow:0 2px 6px rgba(0,0,0,.6)}
#cineCap .skip{display:block;margin-top:10px;font-size:13px;color:#f4e8cc;opacity:.75;text-shadow:0 1px 4px #000}
#cineCap .bar{width:120px;height:3px;margin:10px auto 0;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
#cineCap .bar i{display:block;height:100%;width:0;background:#e8c66a}
body.cine #cineCap .bar i{animation:cineBar var(--cine,3.5s) linear forwards}
@keyframes cineBar{to{width:100%}}
#cineTap{position:fixed;inset:0;z-index:3;display:none}
body.cine #cineTap, body.peek #cineTap{display:block}
#eyeBtn{position:fixed;top:12px;right:116px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid rgba(244,232,204,.5);
  background:rgba(10,25,40,.7);color:#f4e8cc;font-size:19px;cursor:pointer}
body.peek #eyeBtn{background:#9c4a24;border-color:#e8c66a}
body.standalone #eyeBtn{right:64px}
#app.enter > *{animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both}
#app.enter > *:nth-child(2){animation-delay:.07s}
#app.enter > *:nth-child(3){animation-delay:.14s}
#app.enter > *:nth-child(4){animation-delay:.21s}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
#curtain{position:fixed;inset:0;background:#05070c;opacity:0;pointer-events:none;z-index:0;transition:opacity .45s ease}
#curtain.dark{opacity:.6;transition:opacity .3s ease}
.simg.pre{filter:blur(12px) brightness(.55)}
/* движение камеры по сценам */
.simg.cam-arrive{animation:arrive 11s cubic-bezier(.25,.6,.3,1) forwards, bobS 7s ease-in-out 11s infinite}
@keyframes arrive{from{transform:scale(1) translate(4%,1.5%)}to{transform:scale(1.14) translate(-2%,-1%)}}
@keyframes bobS{0%,100%{transform:scale(1.14) translate(-2%,-1%)}50%{transform:scale(1.15) translate(-2.3%,-.6%)}}
.simg.cam-sea{animation:seaBob 7s ease-in-out infinite}
@keyframes seaBob{0%,100%{transform:scale(1.08) translateY(0) rotate(-.5deg)}50%{transform:scale(1.08) translateY(1.4%) rotate(.6deg)}}
.simg.cam-kb{animation:kb 40s ease-in-out infinite alternate}
/* эффекты поверх картинок */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fx .flicker{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,170,60,.18),rgba(0,0,0,0) 65%);animation:flick 2.3s infinite}
@keyframes flick{0%,100%{opacity:.7}12%{opacity:1}20%{opacity:.6}45%{opacity:.95}60%{opacity:.75}80%{opacity:1}}
#fx .spark{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#ffd98a;box-shadow:0 0 10px 3px rgba(255,200,90,.8);animation:rise linear infinite}
@keyframes rise{from{transform:translate(0,0);opacity:0}10%{opacity:1}to{transform:translate(var(--dx),-105vh);opacity:0}}
#fx .gull{position:absolute;width:34px;height:12px;animation:glide linear infinite}
#fx .gull svg{display:block;animation:flapG .5s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes glide{from{transform:translateX(-60px)}to{transform:translateX(calc(100vw + 60px))}}
@keyframes flapG{from{transform:scaleY(1)}to{transform:scaleY(-.4)}}
#fx .glint{position:absolute;left:0;right:0;bottom:0;height:35%;background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 40px,rgba(255,255,255,.07) 40px 46px,rgba(255,255,255,0) 46px 90px);background-size:300px 100%;animation:glint 6s linear infinite;mix-blend-mode:screen}
@keyframes glint{to{background-position:300px 0}}
.svid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
.svid.hold{animation:holdZoom 40s ease-out forwards}
@keyframes holdZoom{from{transform:scale(1)}to{transform:scale(1.08) translate(-1%,-1%)}}
.mi-hint{margin:12px 0 4px;padding:10px;border-radius:10px;background:#fff3d6;border:1px solid var(--gold);font-size:14px;color:var(--ink2)}
.mi-hint .btn{display:inline-block;margin-top:8px;text-decoration:none;min-width:0}
/* мини-карта открытия */
.revealbox{margin:12px 0 14px;position:relative}
.revealbox .rv-cap{position:absolute;left:10px;top:8px;font-family:'Philosopher',serif;font-weight:700;color:#6b3a1a;font-size:14px;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.rv-land{fill:#d8c194;stroke:#7a5530;stroke-width:.5}
.rv-hit{fill:#b5793d;fill-opacity:0;stroke:#7a2a12;stroke-width:1.8;transition:fill-opacity 1s ease .2s}
.rv-hit.filled{fill-opacity:1}
.rv-route{fill:none;stroke:#9c2a1e;stroke-width:2.6;stroke-linecap:round}
.rv-circle{fill:#6fa0a8;fill-opacity:0;stroke:#2f5d66;stroke-width:1.6;stroke-dasharray:5 4;transition:fill-opacity 1s ease}
.rv-circle.filled{fill-opacity:.35}

function startVideoLoop(layer, src, key, alive){
  const mk = () => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = src; v.className = 'svid';
    v.style.transition = `opacity ${XFADE}s ease`;
    layer.appendChild(v); return v;
  };
  const A = mk();
  const onPlaying = () => {
    A.style.opacity = 1;
    layer.classList.remove('cam-arrive','cam-sea','cam-kb'); layer.style.transform = 'none';
    document.getElementById('fx').innerHTML = ''; curFx = 'video';
  };
  /* отрицательное значение — повторять только последние N секунд (ролик сначала идёт целиком) */
  const loopVal = VIDEO_LOOP[key] || 0;
  if(loopVal === 'hold'){
    /* сюжетный ролик: проигрывается один раз и замирает на последнем кадре, дальше — медленный наезд */
    const v = A;
    v.dataset.hold = '1';
    v.addEventListener('ended', () => { v.classList.add('hold'); });
    v.addEventListener('timeupdate', () => { if(!alive()) v.pause(); });
    v.addEventListener('playing', onPlaying, {once:true});
    v.play().catch(() => {});
    return;
  }
  if(false && LITE){ /* v1.5: на телефонах снова плавная склейка двух роликов, как на ПК */
    /* телефон: одно видео; в конце растворяется в картинку сцены и начинается заново */
    let fading = false;
    A.addEventListener('timeupdate', () => {
      if(!alive()){ A.pause(); return; }
      if(!fading && A.duration && A.currentTime > A.duration - 1){ fading = true; A.style.opacity = 0; }
    });
    A.addEventListener('ended', () => {
      A.currentTime = loopVal > 0 ? loopVal : 0;
      A.play().catch(() => {});
      setTimeout(() => { A.style.opacity = 1; fading = false; }, 120);
    });
    A.addEventListener('playing', onPlaying, {once:true});
    A.play().catch(() => {});
    return;
  }
  const B = mk();
  let cur = A, other = B, swapping = false;
  const onTime = () => {
    if(!alive()){ A.pause(); B.pause(); return; }
    if(swapping || !cur.duration || cur.currentTime < cur.duration - XFADE - .15) return;
    swapping = true;
    const nxt = other, prev = cur;
    nxt.currentTime = loopVal < 0 ? Math.max(0, cur.duration + loopVal - XFADE) : loopVal;
    nxt.play().then(() => {
      nxt.style.zIndex = 2; prev.style.zIndex = 1;
      nxt.style.opacity = 1;
      setTimeout(() => { prev.style.opacity = 0; prev.pause(); cur = nxt; other = prev; swapping = false; }, XFADE * 1000 + 50);
    }).catch(() => { swapping = false; });
  };
  A.addEventListener('timeupdate', onTime); B.addEventListener('timeupdate', onTime);
  A.addEventListener('playing', onPlaying, {once:true});
  A.play().catch(() => {});
}

const SCENE_SND = {

  'fog':'fog', 'palos':'port-day', 'ocean-day':'ocean-day', 'ocean-night':'ocean-night', 'island':'island',

function findSnd(file){

  if(SND.cache[file] !== undefined) return SND.cache[file];

    <div class="chips">${SHIP_IDEAS.map(s => `<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <label>Цвет парусов</label>
    <div class="row" style="align-items:center;margin-top:4px">
      <div class="swatches">${SAILS.map((s,k) => `<div class="sw${k===0?' sel':''}" data-c="${s.c}" title="${s.n}" style="background:${s.c}"></div>`).join('')}</div>
      <div id="prev">${shipSvg(color,64)}</div>
    </div>
    <div class="row"><button class="btn wide" id="go" disabled>Поднять паруса!</button></div>
  </div>`;
  fillAvatars();
  const nm = document.getElementById('nm'), sh = document.getElementById('sh'), go = document.getElementById('go');
  const check = () => { go.disabled = !(nm.value.trim() && sh.value.trim()); };
  nm.oninput = check; sh.oninput = check;
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { sh.value = b.dataset.s; check(); });
  app.querySelectorAll('.sw').forEach(s => s.onclick = () => {
    app.querySelectorAll('.sw').forEach(x => x.classList.remove('sel'));
    s.classList.add('sel'); color = s.dataset.c;
    document.getElementById('prev').innerHTML = shipSvg(color,64); drawBgShip(color);
  });
  go.onclick = () => {
    state.player = {name:nm.value.trim(), ship:sh.value.trim(), color};
    save(); renderHub(); goTop();
  };
}

function renderHub(){
  const tasksTotal = allTasks().length;
  showScene('port-day');
  setSpeaker(null);
  app.innerHTML = `${topbar()}
    <div class="card">
      <h2>Атлас мира</h2>
      <div class="mapbox" id="hubmap"><p class="muted center" style="padding:30px">Разворачиваем атлас…</p></div>
      <p class="muted" style="margin-top:8px;font-size:15px">${state.revealed.length ? `Открыто земель: ${state.revealed.length}. Отвечай верно, и туман будет рассеиваться дальше.` : 'Атлас пока скрыт туманом. Каждый верный ответ откроет на нём новые земли.'}</p>
    </div>
    <div class="card">
      <h2>Плавания</h2>
      ${CHAPTERS.map((c,k) => {
        const cs = state.ch[c.id];
        if(!c.ready) return `<div class="chapter locked"><div class="num">${k+1}</div><div class="info"><div class="t">${c.title}</div><div class="s">${c.sub} · скоро</div></div></div>`;
        const done = cs && cs.done;
        const inProg = cs && !cs.done && cs.idx > 0;
        const label = done ? 'Пройти ещё раз' : (inProg ? 'Продолжить' : 'Отплыть');
        return `<div class="chapter"><div class="num">${k+1}</div><div class="info"><div class="t">${c.title}</div>
          <div class="s">${c.sub}</div>${done ? `<div class="badge">✓ Пройдено: ${score(c)} из ${c.steps.filter(s=>s.type!=='story').length}</div>` : ''}</div>
          <button class="btn small" data-ch="${c.id}">${label}</button></div>`;
      }).join('')}
    </div>
    <div class="row"><button class="btn ghost wide" id="jr" style="color:var(--parch);border-color:var(--parch)">Судовой журнал · ${state.journal.length} из ${tasksTotal}</button></div>
    <div class="foot"><button class="linkbtn" id="reset">Начать игру заново</button></div>`;
  app.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => startChapter(b.dataset.ch));
  document.getElementById('jr').onclick = () => { renderJournal(); goTop(); };
  document.getElementById('reset').onclick = restartGame;
  worldReady.then(drawHubMap);
}

function score(c){ const cs = state.ch[c.id]; if(!cs) return 0; return Object.values(cs.best || cs.answers || {}).filter(v => v === true).length; }

function drawHubMap(){
  const box = document.getElementById('hubmap'); if(!box) return;
  if(!world){ box.innerHTML = '<p class="muted center" style="padding:30px">Для карты нужен интернет. Задания без карты работают и так.</p>'; return; }
  const w = box.clientWidth, h = Math.round(w*0.56);
  const rev = new Set(state.revealed);
  const fresh = new Set(state.newRev || []);
  const found = world.filter(f => rev.has(+f.id));
  let proj;
  if(found.length){
    /* приближаем атлас к открытым землям, оставляя вокруг «туман» неизвестного мира */
    const b = d3.geoBounds({type:'FeatureCollection', features:found.concat([{type:'Feature',geometry:{type:'Point',coordinates:TORTUGA}}])});
    const pad = 14;
    const bb = [[Math.max(-180, b[0][0]-pad), Math.max(-70, b[0][1]-pad)], [Math.min(180, b[1][0]+pad), Math.min(80, b[1][1]+pad)]];
    proj = d3.geoMercator().fitExtent([[6,6],[w-6,h-6]], {type:'MultiPoint', coordinates:bb}).clipExtent([[0,0],[w,h]]);
  } else {
    proj = d3.geoNaturalEarth1().fitExtent([[4,4],[w-4,h-4]], {type:'Sphere'});
  }
  const path = d3.geoPath(proj);
  const svg = d3.select(box).html('').append('svg').attr('width',w).attr('height',h).style('cursor','default');
  svg.append('rect').attr('class','sea').attr('width',w).attr('height',h);
  svg.append('path').datum(d3.geoGraticule10()).attr('class','grat').attr('d',path);
  svg.selectAll('.land').data(world).join('path')
    .attr('class', d => 'land ' + (fresh.has(+d.id) ? 'newrev' : (rev.has(+d.id) ? 'revealed' : 'fog'))).attr('d',path);
  if(fresh.size){
    setTimeout(() => { svg.selectAll('.land.newrev').classed('go', true); sfx('coin'); }, 700);
    state.newRev = []; save();
  }
  CHAPTERS.forEach(c => {
    if(c.route && state.ch[c.id] && state.ch[c.id].done){
      svg.append('path').datum({type:'LineString', coordinates:c.route}).attr('class','route').attr('d',path);
    }
  });
  const [x,y] = proj(TORTUGA);
  svg.append('g').attr('transform', `translate(${x-17},${y-22}) scale(.26)`).html(shipPaths(state.player.color));
}

function startChapter(id){
  const cs = state.ch[id];
  if(cs && cs.done){ state.ch[id] = {idx:0, answers:{}, done:true, replay:true, best:cs.best || cs.answers}; }
  else if(!cs){ state.ch[id] = {idx:0, answers:{}, done:false}; }
  save(); renderChapter(id); goTop();
}

function renderChapter(id){
  const c = CHAPTERS.find(x => x.id === id), cs = state.ch[id];
  const tasks = c.steps.filter(s => s.type !== 'story');
  if(cs.idx >= c.steps.length) return finishChapter(c);
  const step = c.steps[cs.idx];
  let sc = 'ocean-day'; for(let k=cs.idx;k>=0;k--){ if(c.steps[k].scene){ sc = c.steps[k].scene; break; } }
  showScene(sc);
  if(sc === 'island') replayHold();
  if(step.who) setSpeaker(step.who); else setCast('hero', null, 'L');
  const doneCount = c.steps.slice(0, cs.idx).filter(s => s.type !== 'story').length;
  const bar = `<div class="progress"><div style="width:${Math.round(doneCount/tasks.length*100)}%"></div></div>`;
  if(step.type === 'story'){
    app.innerHTML = `${topbar()}${bar}<div class="card story">${speakerHtml(step.who)}${paras(step.text)}
      <div class="row"><button class="btn" id="next">Дальше</button></div></div>`;
    fillAvatars();
    document.getElementById('next').onclick = () => { cs.idx++; save(); renderChapter(id); goTop(); };
    return;
  }
  cur = {hint:false, chapter:id};
  const num = tasks.indexOf(step) + 1;
  app.innerHTML = `${topbar()}${bar}<div class="card">
    ${speakerHtml(step.who)}
    <div class="tasknum">Задание ${num} из ${tasks.length}</div>
    <div class="q">${fill(step.q)}</div>
    <div id="hintbox"><button class="btn ghost small" id="hintBtn">Спросить штурмана</button>
      <span class="muted" style="font-size:14px"> подсказка уменьшит награду до 5 золотых</span></div>
    <div id="body" style="margin-top:12px"></div>
    <div id="feedback"></div></div>
    <div class="foot"><button class="linkbtn" id="tohub">Вернуться в порт (прогресс сохранится)</button></div>`;
  fillAvatars();
  document.getElementById('hintBtn').onclick = () => {
    cur.hint = true; setSpeaker('sebastian');
    document.getElementById('hintbox').innerHTML = `<div class="hint">Себастьян: «${step.hint}»</div>`;
  };
  document.getElementById('tohub').onclick = () => { renderHub(); goTop(); };
  const body = document.getElementById('body');
  ({choice:renderChoice, map:renderMapTask, order:renderOrder, match:renderMatch})[step.type](step, body);
}

function answer(task, ok, rightText){
  const cs = state.ch[cur.chapter];
  const first = !(task.id in cs.answers);
  let reward = 0, newCard = false;
  if(first){
    cs.answers[task.id] = ok;
    if(ok === true && !cs.replay){ reward = cur.hint ? 5 : 10; state.gold += reward; }
    if(reward) setTimeout(() => sfx('coin'), 450);
    if(task.card && !state.journal.includes(task.id)){ state.journal.push(task.id); newCard = true; }
    if(ok === true && task.rv) revealIds(task.rv.ids);
    save();
  }
  const hb = document.getElementById('hintbox'); if(hb && !cur.hint) hb.innerHTML = '';
  sfx(ok === true ? 'ok' : (ok === false ? 'bad' : 'click'));
  const cls = ok === true ? 'ok' : (ok === false ? 'bad' : 'neutral');
  const title = ok === true ? 'Верно!' : (ok === false ? 'Не совсем…' : 'Вот что важно знать');
  document.getElementById('feedback').innerHTML = `<div class="fb ${cls}">
    <h3>${title}</h3>
    ${ok === false && rightText ? `<p><b>Правильный ответ:</b> ${rightText}</p>` : ''}
    ${ok === true && task.rv && task.rv.bbox ? '<div class="mapbox revealbox" id="rvmap"><span class="rv-cap">Атлас оживает</span></div>' : ''}
    ${task.exp.map(t => `<p>${t}</p>`).join('')}
    ${reward ? `<p class="reward">+${reward} золотых</p>` : ''}
    ${newCard ? `<p class="newcard">В журнал добавлена карточка «${task.card.title}»</p>` : ''}
    <button class="btn" id="cont">Дальше</button></div>`;
  document.getElementById('cont').onclick = () => { cs.idx++; save(); renderChapter(cur.chapter); goTop(); };
  document.getElementById('feedback').scrollIntoView({behavior:'smooth', block:'start'});
  if(ok === true && task.rv && task.rv.bbox) worldReady.then(() => drawReveal(task.rv));
}

/* ===================== ОТКРЫТИЕ НОВЫХ ЗЕМЕЛЬ ===================== */
function revealIds(ids){
  state.newRev = state.newRev || [];
  (ids || []).forEach(id => {
    if(!state.revealed.includes(id)){ state.revealed.push(id); state.newRev.push(id); }
  });
}
function drawReveal(rv){
  const box = document.getElementById('rvmap'); if(!box) return;
  if(!world){ box.remove(); return; }
  const w = box.clientWidth, h = Math.round(w * 0.5);
  const proj = d3.geoMercator().fitExtent([[12,12],[w-12,h-12]], {type:'MultiPoint', coordinates:rv.bbox}).clipExtent([[0,0],[w,h]]);
  const path = d3.geoPath(proj);
  const svg = d3.select(box).append('svg').attr('width', w).attr('height', h);
  svg.append('path').datum(d3.geoGraticule().step([5,5])()).attr('class','grat').attr('d', path);
  svg.selectAll('.rv-land').data(world).join('path').attr('class','rv-land').attr('d', path);
  const ids = (rv.hl || []).concat(rv.ids || []);
  const hits = svg.selectAll('.rv-hit').data(world.filter(f => ids.includes(+f.id))).join('path').attr('class','rv-hit').attr('d', path);
  hits.each(function(){
    const L = this.getTotalLength ? this.getTotalLength() : 0;
    d3.select(this).attr('stroke-dasharray', L).attr('stroke-dashoffset', L)
      .transition().duration(1600).ease(d3.easeCubicInOut).attr('stroke-dashoffset', 0)
      .on('end', function(){ d3.select(this).attr('stroke-dasharray', null).classed('filled', true); });
  });
  let delay = ids.length ? 1300 : 200;
  if(rv.circle){
    const c = d3.geoCircle().center([rv.circle[0], rv.circle[1]]).radius(rv.circle[2])();
    const cp = svg.append('path').datum(c).attr('class','rv-circle').attr('d', path).style('opacity', 0);
    setTimeout(() => { cp.transition().duration(900).style('opacity', 1).on('end', () => cp.classed('filled', true)); }, 200);
    delay = 1000;
  }
  if(rv.route){
    const rp = svg.append('path').datum({type:'LineString', coordinates:rv.route}).attr('class','rv-route').attr('d', path);
    const L = rp.node().getTotalLength();
    rp.attr('stroke-dasharray', `${L} ${L}`).attr('stroke-dashoffset', L)
      .transition().duration(2600).ease(d3.easeCubicInOut).attr('stroke-dashoffset', 0)
      .on('end', () => rp.attr('stroke-dasharray', '7 5'));
    delay = 2300;
  }
  if(rv.at){
    const [x, y] = proj(rv.at);
    setTimeout(() => {
      if(!rv.route && !rv.circle){
        svg.append('circle').attr('class','rv-pulse').attr('cx', x).attr('cy', y).attr('r', 6);
        svg.append('circle').attr('class','rv-dot').attr('cx', x).attr('cy', y).attr('r', 5);
      }
      const anchor = x > w * .7 ? 'end' : (x < w * .3 ? 'start' : 'middle');
      const t = svg.append('text').attr('class','rv-label').attr('x', x + (anchor === 'start' ? 10 : anchor === 'end' ? -10 : 0))
        .attr('y', y - 12).attr('text-anchor', anchor).text(rv.label);
      requestAnimationFrame(() => t.classed('on', true));
      sfx('coin');
    }, delay);
  }
}

/* ---------- Типы заданий ---------- */
function renderChoice(task, body){
  const order = task.noShuffle ? task.opts.map((_,i) => i) : shuffle(task.opts.map((_,i) => i));
  body.innerHTML = order.map(i => `<button class="opt" data-i="${i}">${esc(task.opts[i])}</button>`).join('');
  body.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ok = i === task.ans;
    body.querySelectorAll('.opt').forEach(x => { x.disabled = true; if(+x.dataset.i === task.ans) x.classList.add('right'); });
    if(!ok) b.classList.add('wrong');
    answer(task, ok, esc(task.opts[task.ans]));
  });
}

function renderOrder(task, body){
  const items = shuffle(task.items.map((t,i) => ({t,i})));
  let seq = [], locked = false;
  function draw(result){
    body.innerHTML = `<div>${task.items.map((_,k) => {
        const it = seq[k];
        const cls = result ? (it && it.i === k ? ' ok' : ' no') : '';
        return `<div class="slot${cls}">${k+1}. ${it ? esc(it.t) : '<span class="muted">…</span>'}</div>`;
      }).join('')}</div>
      ${locked ? '' : `<p class="muted" style="font-size:15px;margin:10px 0 4px">Нажимай события по порядку:</p>
      <div class="chips">${items.filter(x => !seq.includes(x)).map(x => `<button class="chip" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost small" id="ores">Сбросить</button>
      <button class="btn small" id="ochk" ${seq.length < items.length ? 'disabled' : ''}>Проверить</button></div>`}`;
    if(locked) return;
    body.querySelectorAll('.chip').forEach(b => b.onclick = () => { seq.push(items.find(x => x.i === +b.dataset.i)); draw(); });
    document.getElementById('ores').onclick = () => { seq = []; draw(); };
    document.getElementById('ochk').onclick = () => {
      locked = true;
      const ok = seq.every((it,k) => it.i === k);
      draw(true);
      answer(task, ok, task.items.map(esc).join(' → '));
    };
  }
  draw();
}

function renderMatch(task, body){
  const P = task.pairs, right = shuffle(P.map((_,j) => j));
  let sel = 0, asg = {}, locked = false;
  function draw(result){
    body.innerHTML = P.map((p,i) => {
      const cls = result ? (asg[i] === i ? ' ok' : ' no') : (sel === i && !locked ? ' sel' : '');
      return `<button class="mrow${cls}" data-l="${i}"><b>${esc(p[0])}</b><span>${asg[i] != null ? esc(P[asg[i]][1]) : '— выбери вариант ниже —'}</span></button>`;
    }).join('') + (locked ? '' : `<div class="chips">${right.map(j => `<button class="chip${Object.values(asg).includes(j) ? ' used' : ''}" data-r="${j}">${esc(P[j][1])}</button>`).join('')}</div>
      <div class="row"><button class="btn small" id="mchk" ${Object.keys(asg).length < P.length ? 'disabled' : ''}>Проверить</button></div>`);
    if(locked) return;
    body.querySelectorAll('.mrow').forEach(b => b.onclick = () => { sel = +b.dataset.l; draw(); });
    body.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      const j = +b.dataset.r;
      Object.keys(asg).forEach(k => { if(asg[k] === j) delete asg[k]; });
      asg[sel] = j;
      const nxt = P.findIndex((_,i) => asg[i] == null);
      if(nxt >= 0) sel = nxt;
      draw();
    });
    document.getElementById('mchk').onclick = () => {
      locked = true;
      const ok = P.every((_,i) => asg[i] === i);
      draw(true);
      answer(task, ok, P.map(p => `${esc(p[0])} — ${esc(p[1])}`).join('; '));
    };
  }
  draw();
}

function renderMapTask(task, body){
  body.innerHTML = '<p class="muted">Загружаем карту…</p>';
  worldReady.then(() => {
    if(!world){
      body.innerHTML = `<p class="muted">Карта не загрузилась — для неё нужен интернет.</p><button class="btn small" id="skip">Пропустить задание</button>`;
      document.getElementById('skip').onclick = () => { document.getElementById('skip').disabled = true; answer(task, null, ''); };
      return;
    }
    body.innerHTML = `<div class="mapbox" id="tmap"></div>
      <p class="muted" style="font-size:15px;margin:8px 0 0">Нажми на карту, чтобы поставить отметку, затем подтверди.</p>
      <div class="row"><button class="btn small" id="mok" disabled>Подтвердить</button></div>`;
    const box = document.getElementById('tmap');
    const w = box.clientWidth, h = Math.round(w*0.72);
    const proj = d3.geoMercator().fitExtent([[10,10],[w-10,h-10]], {type:'MultiPoint', coordinates:task.bbox}).clipExtent([[0,0],[w,h]]);
    const path = d3.geoPath(proj);
    const svg = d3.select(box).append('svg').attr('width',w).attr('height',h);
    svg.append('rect').attr('class','sea').attr('width',w).attr('height',h);
    svg.append('path').datum(d3.geoGraticule().step([5,5])()).attr('class','grat').attr('d',path);
    svg.selectAll('.land').data(world).join('path').attr('class','land plain').attr('d',path);
    (task.labels || []).forEach(([lon,lat,t]) => { const [x,y] = proj([lon,lat]); svg.append('text').attr('class','maplabel').attr('x',x).attr('y',y).attr('text-anchor','middle').text(t); });
    const mk = svg.append('g').style('display','none');
    mk.append('circle').attr('r',9).attr('fill','none').attr('stroke','#9c4a24').attr('stroke-width',2.5);
    mk.append('circle').attr('r',3).attr('fill','#9c4a24');
    let pick = null, done = false;
    svg.on('click', ev => {
      if(done) return;
      const [x,y] = d3.pointer(ev);
      pick = proj.invert([x,y]);
      mk.style('display',null).attr('transform', `translate(${x},${y})`);
      document.getElementById('mok').disabled = false;
    });
    document.getElementById('mok').onclick = () => {
      if(!pick || done) return;
      done = true; document.getElementById('mok').disabled = true;
      const km = d3.geoDistance(pick, task.target) * 6371;
      let ok = km <= task.tol;
      if(!ok && task.country){ const f = world.find(f => +f.id === task.country); if(f && d3.geoContains(f, pick)) ok = true; }
      const [tx,ty] = proj(task.target), [px,py] = proj(pick);
      if(!ok) svg.append('line').attr('x1',px).attr('y1',py).attr('x2',tx).attr('y2',ty).attr('stroke','#a23b2f').attr('stroke-width',1.5).attr('stroke-dasharray','4 3');
      svg.append('circle').attr('cx',tx).attr('cy',ty).attr('r',7).attr('fill', '#2f7a4a').attr('stroke','#fff').attr('stroke-width',2);
      svg.append('text').attr('x',tx+10).attr('y',ty-8).attr('font-weight','700').attr('font-size',14).attr('fill','#1d4d2f').text(task.targetLabel);
      answer(task, ok, `зелёная точка на карте — ${esc(task.targetLabel)}${ok ? '' : ` (твоя отметка в ${Math.round(km)} км от неё)`}`);
    };
  });
}

function finishChapter(c){
  showScene('sunset-port');
  setCast('hero', 'sebastian', 'L');
  setTimeout(() => sfx('fanfare'), 300);
  const cs = state.ch[c.id];
  const tasks = c.steps.filter(s => s.type !== 'story');
  const right = Object.values(cs.answers).filter(v => v === true).length;
  let bonus = 0;
  if(!cs.done){
    cs.done = true; bonus = 20; state.gold += bonus;
    revealIds(c.reveal);
  }
  if(cs.replay){
    const prevBest = cs.best ? Object.values(cs.best).filter(v => v === true).length : 0;
    if(right > prevBest) cs.best = Object.assign({}, cs.answers);
  } else { cs.best = Object.assign({}, cs.answers); }
  save();
  app.innerHTML = `${topbar()}<div class="card story">
    <h2>Глава пройдена!</h2>
    ${speakerHtml('hero')}
    ${paras(c.outro)}
    <p><b>Верных ответов: ${right} из ${tasks.length}</b>${bonus ? ` · <span style="color:var(--gold);font-weight:700">+${bonus} золотых за плавание</span>` : ''}</p>
    <div class="row"><button class="btn" id="hub">Открыть атлас</button></div></div>`;
  fillAvatars();
  document.getElementById('hub').onclick = () => { renderHub(); goTop(); };
}

function renderJournal(){
  const all = allTasks().filter(t => t.card);
  showScene('map');
  setSpeaker(null);
  app.innerHTML = `${topbar()}<div class="card">
    <h2>Судовой журнал</h2>
    <p class="muted">Собрано карточек: ${state.journal.length} из ${all.length}</p>
    <div class="jgrid">${all.map(t => state.journal.includes(t.id)
      ? `<div class="jcard"><h3>${t.card.title}</h3><p>${t.card.text}</p></div>`
      : `<div class="jcard locked">Ещё не открыто</div>`).join('')}</div>
    <div class="row"><button class="btn" id="back">Назад в порт</button></div></div>`;
  document.getElementById('back').onclick = () => { renderHub(); goTop(); };
}

start();
</script>
</body>
</html>
